d":"1.5-1add4xr","answer":"7\n6"},{"t":"trace","topic":"1.5","code":"int x = Integer.MAX_VALUE;\nx = x + 1;\nSystem.out.println(x < 0);","wrong":["false","Crash: ArithmeticException","Compile error"],"why":"Overflow does not crash. MAX_VALUE + 1 wraps around to MIN_VALUE, which is negative.","id":"1.5-1ykdzj7","answer":"true"},{"t":"fill","topic":"1.5","task":"Print the exact average 3.5 of a and b.","code":"int a = 3;\nint b = 4;\ndouble avg = ____;\nSystem.out.println(avg);","opts":["(a + b) / 2.0","(a + b) / 2","(double) ((a + b) / 2)","a + b / 2.0"],"expect":"3.5","why":"You need a double inside the division. (a + b) / 2.0 works. The others either do integer division first or divide only b (order of operations).","id":"1.5-1685aq","optOut":["3.5","3.0","3.0","5.0"]},{"t":"mc","topic":"1.5","q":"Which line will NOT compile?","answer":"int n = 4.0;","wrong":["double d = 4;","int n = (int) 4.7;","double d = 4 / 3;"],"why":"Java will automatically widen int → double, but never narrows double → int without a cast. 4.0 is a double.","id":"1.5-mfqrfd"},{"t":"trace","topic":"1.6","code":"int x = 6;\nx += 4;\nx *= 3;\nx -= 5;\nx /= 4;\nSystem.out.println(x);","wrong":["6.25","7","5"],"why":"6 → 10 → 30 → 25 → 25 / 4 = 6 (integer division).","id":"1.6-y0sd2a","answer":"6"},{"t":"trace","topic":"1.6","code":"int count = 0;\ncount++;\ncount++;\ncount--;\ncount += 10;\ncount %= 4;\nSystem.out.println(count);","wrong":["11","2","1"],"why":"0 → 1 → 2 → 1 → 11 → 11 % 4 = 3.","id":"1.6-1vfc5yo","answer":"3"},{"t":"mc","topic":"1.6","q":"After this code runs, what is the value of total?","code":"int total = 5;\ntotal *= 2 + 3;","answer":"25","wrong":["13","10","15"],"why":"The whole right side is computed first: 2 + 3 = 5. Then total = total * 5 = 25. It is NOT total * 2 + 3.","id":"1.6-8989ym"},{"t":"trace","topic":"1.9","code":"public class Main {\n    public static int triple(int n) {\n        return n * 3;\n    }\n\n    public static void main(String[] args) {\n        int a = triple(2);\n        int b = triple(a + 1);\n        System.out.println(a + \" \" + b);\n    }\n}","wrong":["6 7","6 9","2 21"],"why":"triple(2) = 6. Then a + 1 = 7 is passed in, so triple(7) = 21.","id":"1.9-utlxai","answer":"6 21"},{"t":"trace","topic":"1.9","code":"public class Main {\n    public static void change(int x) {\n        x = 100;\n    }\n\n    public static void main(String[] args) {\n        int x = 5;\n        change(x);\n        System.out.println(x);\n    }\n}","wrong":["100","105","Compile error"],"why":"The method gets a COPY of 5 in its own x. Setting that copy to 100 does nothing to main's x. Same name, different variable.","id":"1.9-1ebz1kd","answer":"5"},{"t":"trace","topic":"1.9","code":"public class Main {\n    public static int mystery(int a, int b) {\n        if (a > b) {\n            return a - b;\n        }\n        return b - a;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(mystery(3, 8));\n        System.out.println(mystery(8, 3));\n    }\n}","wrong":["-5\n5","5\n-5","-5\n-5"],"why":"return ends the method right away. mystery always returns the distance between a and b, so both are 5.","id":"1.9-pp1gq5","answer":"5\n5"},{"t":"trace","topic":"1.9","code":"public class Main {\n    public static void show(int n) {\n        System.out.print(n * 2 + \" \");\n    }\n\n    public static void main(String[] args) {\n        show(1);\n        show(3);\n        System.out.println(\"done\");\n    }\n}","wrong":["1 3 done","2\n6\ndone","done"],"why":"show prints n * 2 followed by a space, staying on the same line. Then println prints done.","id":"1.9-1vdjptw","answer":"2 6 done"},{"t":"mc","topic":"1.9","q":"What is the signature of this method?","code":"public static double average(int a, int b)","answer":"average(int, int)","wrong":["double average(int a, int b)","average(int a, int b)","public static double average"],"why":"A signature is the method name plus the parameter TYPES in order. The return type, modifiers and parameter names are not part of it.","id":"1.9-54gljy"},{"t":"mc","topic":"1.9","q":"In the call greet(\"Ana\"), what is \"Ana\"?","answer":"An argument (actual parameter)","wrong":["A formal parameter","The return value","The method signature"],"why":"Arguments are the values you pass in a call. Formal parameters are the variables in the method header that receive them.","id":"1.9-dc2l6e"},{"t":"bug","topic":"1.9","task":"half(9) should return 4.5.","code":"public class Main {\n    public static double half(int n) {\n        return n / 2;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(half(9));\n    }\n}","bug":3,"fix":"        return n / 2.0;","expect":"4.5","why":"n / 2 is int / int = 4, which becomes 4.0 when returned. Dividing by 2.0 keeps the decimal.","id":"1.9-1gofgsv","fixed":"public class Main {\n    public static double half(int n) {\n        return n / 2.0;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(half(9));\n    }\n}","bugOut":"4.0"},{"t":"trace","topic":"1.11","code":"System.out.println(Math.pow(3, 2));\nSystem.out.println(Math.abs(-7));\nSystem.out.println(Math.sqrt(16) + 1);","wrong":["9\n7\n5","6.0\n7\n5.0","9.0\n7.0\n5.0"],"why":"pow and sqrt always return a double (9.0, 5.0). abs keeps the type it was given: an int in, an int out.","id":"1.11-4s492n","answer":"9.0\n7\n5.0"},{"t":"mc","topic":"1.11","q":"Which expression gives a random int from 5 to 10, inclusive?","answer":"(int) (Math.random() * 6) + 5","wrong":["(int) (Math.random() * 10) + 5","(int) (Math.random() * 5) + 5","(int) Math.random() * 6 + 5"],"why":"Range size is max - min + 1 = 6. Math.random() * 6 is 0 to 5.999, cast gives 0 to 5, then +5 shifts to 5 to 10. The last option casts too early and is always 5.","id":"1.11-1xn9ylx"},{"t":"mc","topic":"1.11","q":"What are the possible values of x?","code":"int x = (int) (Math.random() * 4) + 2;","answer":"2, 3, 4, 5","wrong":["2, 3, 4, 5, 6","0, 1, 2, 3","2, 3, 4"],"why":"Math.random() * 4 is 0 up to (not including) 4. Cast: 0 to 3. Plus 2: 2 to 5.","id":"1.11-1akl3xi"},{"t":"trace","topic":"1.11","code":"int a = -3;\nint b = 4;\ndouble r = Math.sqrt(Math.pow(a, 2) + Math.pow(b, 2));\nSystem.out.println(r);","wrong":["5","1.0","7.0"],"why":"Inner calls first: 9.0 + 16.0 = 25.0, sqrt is 5.0. Squaring a negative makes it positive.","id":"1.11-9zs3uj","answer":"5.0"},{"t":"mc","topic":"1.12","q":"What does a reference variable like Turtle t actually store?","answer":"The address of where the object lives in memory","wrong":["A copy of all the object's data","The class blueprint","The object's toString() text"],"why":"Primitives store values directly. Object variables store a reference (an address). That is why two variables can point at the same object.","id":"1.12-n45wps"},{"t":"trace","topic":"1.12","code":"String s = null;\nSystem.out.println(\"start\");\nSystem.out.println(s.length());\nSystem.out.println(\"end\");","wrong":["start\n0\nend","start\nnull\nend","Compile error"],"why":"It compiles fine. At run time, calling length() on null crashes with a NullPointerException, so \"end\" never prints. The answer shows the crash.","id":"1.12-3iez0w","answer":"start\nCrash: NullPointerException"},{"t":"mc","topic":"1.12","q":"Which call is a class (static) method call?","answer":"Math.abs(-2)","wrong":["yertle.forward()","name.length()","myTurtle.getWidth()"],"why":"Static methods are called on the class name. The others are called on an object, so they are instance methods.","id":"1.12-xd677u"},{"t":"mc","topic":"1.12","q":"A class has constructors Dog() and Dog(String name, int age). Which line will NOT compile?","answer":"Dog d = new Dog(3, \"Rex\");","wrong":["Dog d = new Dog();","Dog d = new Dog(\"Rex\", 3);","Dog d = null;"],"why":"Arguments must match a constructor's parameters in number, type AND order. There is no Dog(int, String).","id":"1.12-ovp3fc"},{"t":"mc","topic":"1.12","q":"What is the relationship between a class and an object?","answer":"An object is one instance built from the class blueprint","wrong":["A class is one instance built from an object","They are two words for the same thing","A class is a method inside an object"],"why":"The class defines what attributes and behaviors every object of that type has. Each object is one specific instance with its own values.","id":"1.12-1i5vm8d"},{"t":"trace","topic":"1.15","code":"String s = \"JAVASCRIPT\";\nSystem.out.println(s.substring(4, 7));\nSystem.out.println(s.substring(7));","wrong":["SCRI\nIPT","ASC\nRIPT","SCR\nRIPT"],"why":"Index 4 is S. substring(4, 7) takes 4, 5, 6 = SCR (stops before 7). substring(7) is index 7 to the end: IPT.","id":"1.15-uv05s1","answer":"SCR\nIPT"},{"t":"trace","topic":"1.15","code":"String s = \"hello\";\nSystem.out.println(s.indexOf(\"l\") + s.indexOf(\"x\"));","wrong":["2","1x","3"],"why":"indexOf(\"l\") is 2 (first match). indexOf(\"x\") is -1 (not found). 2 + -1 = 1.","id":"1.15-eb0btp","answer":"1"},{"t":"trace","topic":"1.15","code":"String s = \"code\";\ns.toUpperCase();\nSystem.out.println(s);\nString t = s.toUpperCase();\nSystem.out.println(t + s.length());","wrong":["CODE\nCODE4","code\nCODE","CODE\nCODE5"],"why":"Strings never change. The first toUpperCase() makes a new String and throws it away, so s is still \"code\". t stores the new one.","id":"1.15-1v0tms3","answer":"code\nCODE4"},{"t":"trace","topic":"1.15","code":"String s = \"abc\";\nSystem.out.println(s.substring(1, 4));","wrong":["bc","abc","c"],"why":"Indexes in \"abc\" go 0 to 2, and length is 3. Asking for up to 4 is past the end, so it crashes with StringIndexOutOfBoundsException.","id":"1.15-1rodi9g","answer":"Crash: StringIndexOutOfBoundsException"},{"t":"trace","topic":"1.15","code":"String a = \"cat\";\nString b = \"car\";\nSystem.out.println(a.compareTo(b) > 0);\nSystem.out.println(b.compareTo(\"car\") == 0);","wrong":["false\ntrue","true\nfalse","false\nfalse"],"why":"\"cat\" vs \"car\": first difference is t vs r. t comes after r, so a.compareTo(b) is positive. Same text compares to 0.","id":"1.15-qzo6z6","answer":"true\ntrue"},{"t":"fill","topic":"1.15","task":"Print the last letter of word (should print \"n\").","code":"String word = \"python\";\nSystem.out.println(____);","opts":["word.substring(word.length() - 1)","word.substring(word.length())","word.substring(word.length() - 1, word.length() + 1)","word.substring(5, 5)"],"expect":"n","why":"The last index is length() - 1. substring(length() - 1) goes from there to the end: one letter.","id":"1.15-1v83995","optOut":["n","(nothing printed)","Crash: StringIndexOutOfBoundsException","(nothing printed)"]},{"t":"mc","topic":"2.1","q":"An algorithm says: \"Read a number. If it is negative, make it positive. Repeat until the user enters 0.\" Which building blocks does it use?","answer":"Sequencing, selection, and repetition","wrong":["Only selection","Selection and repetition, but no sequencing","Only sequencing and repetition"],"why":"Steps in order = sequencing. \"If negative\" = selection. \"Repeat until 0\" = repetition. Every algorithm with any steps uses sequencing.","id":"2.1-1u1t5n3"},{"t":"mc","topic":"2.1","q":"In a flowchart, what shape shows a yes/no decision (selection)?","answer":"A diamond","wrong":["A rectangle","An oval","An arrow pointing backwards"],"why":"Diamonds are decisions. Rectangles are actions, ovals are start/end, and an arrow looping back shows repetition.","id":"2.1-uumtza"},{"t":"trace","topic":"2.1","code":"int x = 10;\nx = x - 4;\nx = x / 2;\nSystem.out.println(x);\nint y = 10;\ny = y / 2;\ny = y - 4;\nSystem.out.println(y);","wrong":["3\n3","1\n3","3\n4"],"why":"Same two steps, different order. (10 - 4) / 2 = 3, but 10 / 2 - 4 = 1. Sequencing matters.","id":"2.1-1bj5r32","answer":"3\n1"},{"t":"trace","topic":"2.2","code":"int score = 70;\nSystem.out.println(score > 70);\nSystem.out.println(score >= 70);\nSystem.out.println(score != 70);","wrong":["true\ntrue\nfalse","false\nfalse\nfalse","false\ntrue\ntrue"],"why":"Boundary check: 70 > 70 is false, 70 >= 70 is true, and 70 != 70 is false.","id":"2.2-cwqriy","answer":"false\ntrue\nfalse"},{"t":"trace","topic":"2.2","code":"int a = 4;\nint b = 9;\nboolean r = a * 2 > b - 2;\nSystem.out.println(r);","wrong":["false","Compile error","8 > 7"],"why":"Math first: 8 > 7, which is true. r stores the boolean result.","id":"2.2-1mel49g","answer":"true"},{"t":"trace","topic":"2.2","code":"String x = \"yes\";\nString y = new String(\"yes\");\nSystem.out.println(x == y);\nSystem.out.println(x.equals(y));","wrong":["true\ntrue","false\nfalse","true\nfalse"],"why":"new String makes a separate object, so == (same object?) is false. .equals compares the text, which matches.","id":"2.2-1yur96j","answer":"false\ntrue"},{"t":"mc","topic":"2.2","q":"What is the correct way to check if String name holds \"Sam\"?","answer":"name.equals(\"Sam\")","wrong":["name == \"Sam\"","name = \"Sam\"","name.compareTo(\"Sam\")"],"why":"== compares memory addresses and can fail even when the text matches. = is assignment. compareTo returns an int, not a boolean.","id":"2.2-1alk7lx"},{"t":"mc","topic":"2.2","q":"Why does if (x = 5) fail to compile in Java?","answer":"x = 5 is an assignment that produces an int, and if needs a boolean","wrong":["You cannot use numbers inside an if","It should be if (x := 5)","It compiles fine but always runs"],"why":"An if condition must be a boolean. = stores a value. == compares.","id":"2.2-73xwx8"},{"t":"trace","topic":"2.3","code":"int n = 15;\nif (n % 3 == 0) {\n    System.out.println(\"Fizz\");\n} else if (n % 5 == 0) {\n    System.out.println(\"Buzz\");\n} else {\n    System.out.println(n);\n}","wrong":["Fizz\nBuzz","Buzz","FizzBuzz"],"why":"In an else-if chain only the first true branch runs. 15 % 3 == 0 is true, so Fizz prints and the rest is skipped, even though 15 % 5 == 0 is also true.","id":"2.3-1rmx745","answer":"Fizz"},{"t":"trace","topic":"2.3","code":"int n = 15;\nif (n % 3 == 0) {\n    System.out.println(\"Fizz\");\n}\nif (n % 5 == 0) {\n    System.out.println(\"Buzz\");\n}","wrong":["Fizz","Buzz","FizzBuzz"],"why":"Two separate ifs: each one is checked on its own. Both conditions are true, so both print (on separate lines).","id":"2.3-2xrjhb","answer":"Fizz\nBuzz"},{"t":"trace","topic":"2.3","code":"int temp = 50;\nif (temp > 60) {\n    System.out.println(\"warm\");\n}\nSystem.out.println(\"done\");","wrong":["warm\ndone","warm","Nothing is printed"],"why":"50 > 60 is false, so the body is skipped. Code after the closing brace always runs.","id":"2.3-1qxp8sl","answer":"done"},{"t":"trace","topic":"2.3","code":"int x = 3;\nif (x > 5);\n{\n    System.out.println(\"big\");\n}\nSystem.out.println(\"end\");","wrong":["end","Compile error","big"],"why":"Sneaky: the semicolon right after if (x > 5) IS the if's whole body (an empty statement). The braces below are just a normal block that always runs.","id":"2.3-1pzn5wx","answer":"big\nend"},{"t":"trace","topic":"2.3","code":"int grade = 79;\nString letter = \"F\";\nif (grade >= 90) {\n    letter = \"A\";\n} else if (grade >= 80) {\n    letter = \"B\";\n} else if (grade >= 70) {\n    letter = \"C\";\n}\nSystem.out.println(letter);","wrong":["B","F","A"],"why":"79 fails >= 90 and >= 80, then passes >= 70. letter becomes C.","id":"2.3-493yw5","answer":"C"},{"t":"bug","topic":"2.3","task":"Should print \"teen\" for ages 13 to 19. With age = 13 it prints \"child\".","code":"int age = 13;\nif (age >= 20) {\n    System.out.println(\"adult\");\n} else if (age > 13) {\n    System.out.println(\"teen\");\n} else {\n    System.out.println(\"child\");\n}","bug":4,"fix":"} else if (age >= 13) {","expect":"teen","why":"Boundary bug: 13 > 13 is false, so a 13-year-old falls through to child. Use >= 13 to include 13.","id":"2.3-6grg2x","fixed":"int age = 13;\nif (age >= 20) {\n    System.out.println(\"adult\");\n} else if (age >= 13) {\n    System.out.println(\"teen\");\n} else {\n    System.out.println(\"child\");\n}","bugOut":"child"},{"t":"fill","topic":"2.3","task":"Print \"even\" when n is even, otherwise \"odd\". With n = 8 it should print even.","code":"int n = 8;\nif (____) {\n    System.out.println(\"even\");\n} else {\n    System.out.println(\"odd\");\n}","opts":["n % 2 == 0","n / 2 == 0","n % 2 != 0","n % 2 = 0"],"expect":"even","why":"Even numbers have remainder 0 when divided by 2. n / 2 == 0 is only true for 0 and 1. n % 2 = 0 is assignment and does not compile.","id":"2.3-1dyyx87","optOut":["even","odd","odd","Compile error"]},{"t":"trace","topic":"2.4","code":"int x = 12;\nint y = 3;\nif (x > 10) {\n    if (y > 5) {\n        System.out.println(\"A\");\n    } else {\n        System.out.println(\"B\");\n    }\n} else {\n    System.out.println(\"C\");\n}","wrong":["A","C","B\nC"],"why":"Outer: 12 > 10 is true, go inside. Inner: 3 > 5 is false, so the inner else prints B. The outer else is skipped.","id":"2.4-qzkqse","answer":"B"},{"t":"trace","topic":"2.4","code":"int x = 4;\nif (x > 5)\n    if (x > 2)\n        System.out.println(\"one\");\nelse\n    System.out.println(\"two\");\nSystem.out.println(\"three\");","wrong":["two\nthree","one\nthree","one\ntwo\nthree"],"why":"The else attaches to the closest if (x > 2), not to x > 5, no matter the indenting. x > 5 is false, so the whole nested part is skipped.","id":"2.4-1nam6cv","answer":"three"},{"t":"trace","topic":"2.4","code":"int a = 5;\nint b = 5;\nif (a >= b) {\n    if (a == b) {\n        System.out.print(\"tie \");\n    }\n    System.out.print(\"a wins \");\n}\nSystem.out.println(\"end\");","wrong":["tie end","a wins end","tie\na wins\nend"],"why":"Outer is true. Inner a == b is true so \"tie \" prints. \"a wins \" is inside the outer if but after the inner if, so it prints too. All on one line because of print.","id":"2.4-1r7ig5v","answer":"tie a wins end"},{"t":"trace","topic":"2.4","code":"int roll = 20;\nint armor = 5;\nint dmg = 0;\nif (roll >= armor * 3) {\n    dmg = 12;\n    if (roll >= 18) {\n        dmg *= 2;\n    }\n    dmg -= armor;\n}\nSystem.out.println(dmg);","wrong":["24","7","0"],"why":"20 >= 15 so it hits: dmg = 12. 20 >= 18 is a critical: 24. Then subtract armor: 19.","id":"2.4-55k36o","answer":"19"},{"t":"trace","topic":"2.5","code":"int a = 3;\nint b = 7;\nSystem.out.println(a > 2 && b < 5);\nSystem.out.println(a > 2 || b < 5);\nSystem.out.println(!(a == 3));","wrong":["true\ntrue\nfalse","false\nfalse\ntrue","false\ntrue\ntrue"],"why":"&& needs both: true && false = false. || needs one: true || false = true. a == 3 is true, ! flips it to false.","id":"2.5-1h2ks2z","answer":"false\ntrue\nfalse"},{"t":"trace","topic":"2.5","code":"System.out.println(true || false && false);\nSystem.out.println((true || false) && false);","wrong":["false\nfalse","true\ntrue","false\ntrue"],"why":"&& is done before ||, like × before +. So the first is true || (false && false) = true. Parentheses change it in the second: true && false = false.","id":"2.5-vb3c7f","answer":"true\nfalse"},{"t":"trace","topic":"2.5","code":"int x = 0;\nif (x != 0 && 10 / x > 1) {\n    System.out.println(\"yes\");\n} else {\n    System.out.println(\"no\");\n}","wrong":["yes","Crash: ArithmeticException","Compile error"],"why":"Short-circuit: x != 0 is false, so && stops right there and never computes 10 / x. No crash.","id":"2.5-1cu96t9","answer":"no"},{"t":"trace","topic":"2.5","code":"int x = 0;\nif (10 / x > 1 && x != 0) {\n    System.out.println(\"yes\");\n} else {\n    System.out.println(\"no\");\n}","wrong":["no","yes","Compile error"],"why":"Same parts, flipped order. Now 10 / x runs first and divides by zero, which crashes with ArithmeticException before the check is reached.","id":"2.5-iowr1p","answer":"Crash: ArithmeticException"},{"t":"fill","topic":"2.5","task":"valid should return true only for ages 13 to 19 inclusive, so this prints: false true true false","code":"public class Main {\n    public static boolean valid(int age) {\n        return ____;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(valid(12) + \" \" + valid(13) + \" \" + valid(19) + \" \" + valid(20));\n    }\n}","opts":["age >= 13 && age <= 19","age >= 13 || age <= 19","age > 13 && age < 19","13 <= age <= 19"],"expect":"false true true false","why":"Inside a range needs both conditions (&&), with >= and <= to include the ends. || accepts every age. > and < drop 13 and 19. Java cannot chain 13 <= age <= 19.","id":"2.5-1ex0v22","optOut":["false true true false","true true true true","false false false false","Compile error"]},{"t":"mc","topic":"2.5","q":"Which value of n makes (n > 10 || n % 2 == 0) false?","answer":"7","wrong":["12","4","15"],"why":"An || is false only when BOTH sides are false: n must be 10 or less AND odd. Only 7 fits.","id":"2.5-17mxf02"},{"t":"mc","topic":"2.6","q":"Which is equivalent to !(x > 4 && y < 2)?","answer":"x <= 4 || y >= 2","wrong":["x <= 4 && y >= 2","x < 4 || y > 2","!x > 4 && !y < 2"],"why":"De Morgan: flip each piece and swap && for ||. The opposite of > is <= (not <), and the opposite of < is >=.","id":"2.6-10z3d2n"},{"t":"mc","topic":"2.6","q":"Which is equivalent to !(a || b)?","answer":"!a && !b","wrong":["!a || !b","a && b","!a || b"],"why":"\"Not (a or b)\" means neither one is true: !a && !b.","id":"2.6-o9r62j"},{"t":"mc","topic":"2.6","q":"Which expression is equivalent to !(score < 60)?","answer":"score >= 60","wrong":["score > 60","score <= 60","score > 59.5 && score < 60"],"why":"The opposite of < includes the boundary: >=. Test score = 60: !(60 < 60) is true, and 60 >= 60 is true. 60 > 60 would be false, so that one does not match.","id":"2.6-updzd6"},{"t":"trace","topic":"2.6","code":"int x = 6;\nint y = 2;\nboolean p = !(x > 5 || y > 5);\nboolean q = x <= 5 && y <= 5;\nSystem.out.println(p + \" \" + q + \" \" + (p == q));","wrong":["true true true","false true false","true false false"],"why":"x > 5 is true, so the || is true and p = false. q: 6 <= 5 is false, so q = false. They match, which is De Morgan in action.","id":"2.6-k1ecdp","answer":"false false true"},{"t":"mc","topic":"2.6","q":"Two boolean expressions give the same result for 9 out of 10 test inputs. Are they equivalent?","answer":"No, they must match for every possible input","wrong":["Yes, 90% is close enough","Yes, if they use the same variables","Only if they are the same length"],"why":"Equivalent means interchangeable everywhere. One mismatch proves they are different.","id":"2.6-1ahjztj"},{"t":"trace","topic":"2.7","code":"int i = 0;\nwhile (i < 3) {\n    System.out.print(i + \" \");\n    i++;\n}\nSystem.out.println(\"| \" + i);","wrong":["0 1 2 3 | 3","1 2 3 | 3","0 1 2 | 2"],"why":"Prints 0, 1, 2. When i becomes 3, the condition fails and the loop ends, so i is 3 afterwards.","id":"2.7-16k4epg","answer":"0 1 2 | 3"},{"t":"trace","topic":"2.7","code":"int n = 50;\nint steps = 0;\nwhile (n > 1) {\n    n /= 2;\n    steps++;\n}\nSystem.out.println(steps + \" \" + n);","wrong":["6 1","5 0","25 1"],"why":"50 → 25 → 12 → 6 → 3 → 1. That is 5 halvings, then 1 > 1 is false.","id":"2.7-kv5a6n","answer":"5 1"},{"t":"trace","topic":"2.7","code":"int num = 905;\nint count = 0;\nwhile (num > 0) {\n    num /= 10;\n    count++;\n}\nSystem.out.println(count);","wrong":["2","905","4"],"why":"Each / 10 drops one digit: 905 → 90 → 9 → 0. Three passes, so it counts the digits.","id":"2.7-zw6qoa","answer":"3"},{"t":"trace","topic":"2.7","code":"int x = 10;\nwhile (x < 5) {\n    System.out.println(x);\n    x++;\n}\nSystem.out.println(\"after\");","wrong":["10\nafter","Runs forever","10\n11\n12\n13\n14\nafter"],"why":"The condition is checked before the first pass. 10 < 5 is false right away, so the body runs zero times.","id":"2.7-oakuew","answer":"after"},{"t":"trace","topic":"2.7","code":"int num = 352;\nint rev = 0;\nwhile (num > 0) {\n    rev = rev * 10 + num % 10;\n    num /= 10;\n}\nSystem.out.println(rev);","wrong":["352","10","2"],"why":"Each pass moves the last digit of num onto the end of rev: 2, then 25, then 253. It reverses the number.","id":"2.7-1q28l94","answer":"253"},{"t":"bug","topic":"2.7","task":"Should print 5 4 3 2 1 and stop.","code":"int n = 5;\nwhile (n > 0) {\n    System.out.print(n + \" \");\n    n++;\n}","bug":4,"fix":"    n--;","expect":"5 4 3 2 1","why":"n++ moves n away from 0, so n > 0 stays true until overflow. The update has to move toward ending the loop.","id":"2.7-65t5uj","fixed":"int n = 5;\nwhile (n > 0) {\n    System.out.print(n + \" \");\n    n--;\n}","bugOut":"Runs forever"},{"t":"fill","topic":"2.7","task":"Add up the digits of 4093 (should print 16).","code":"int num = 4093;\nint sum = 0;\nwhile (num > 0) {\n    sum += ____;\n    num /= 10;\n}\nSystem.out.println(sum);","opts":["num % 10","num / 10","num","num % 4093"],"expect":"16","why":"num % 10 is the last digit. Then num /= 10 drops it, so the next pass sees the next digit.","id":"2.7-ow9m8i","optOut":["16","453","4546","453"]},{"t":"trace","topic":"2.8","code":"for (int i = 2; i <= 10; i += 3) {\n    System.out.print(i + \" \");\n}","wrong":["2 5 8 11","2 4 6 8 10","3 6 9"],"why":"i = 2, 5, 8 all pass i <= 10. Then 11 fails, so it stops.","id":"2.8-1g1dup8","answer":"2 5 8"},{"t":"trace","topic":"2.8","code":"int total = 0;\nfor (int k = 5; k > 0; k--) {\n    total += k;\n}\nSystem.out.println(total);","wrong":["10","14","20"],"why":"5 + 4 + 3 + 2 + 1 = 15. When k reaches 0, k > 0 fails.","id":"2.8-jrx4bh","answer":"15"},{"t":"trace","topic":"2.8","code":"for (int i = 0; i < 6; i++) {\n    if (i % 2 == 1) {\n        System.out.print(i);\n    }\n}\nSystem.out.println();","wrong":["024","0246","12345"],"why":"Only odd i pass the if: 1, 3, 5. print keeps them on one line with no spaces.","id":"2.8-e2atvh","answer":"135"},{"t":"trace","topic":"2.8","code":"int x = 1;\nfor (int i = 1; i <= 4; i++) {\n    x *= 2;\n}\nSystem.out.println(x);","wrong":["8","32","4"],"why":"Four passes, doubling each time: 2, 4, 8, 16.","id":"2.8-3880m5","answer":"16"},{"t":"mc","topic":"2.8","q":"How many times does the body of this loop run?","code":"for (int i = 4; i <= 19; i++)","answer":"16","wrong":["15","19","17"],"why":"For i = a to b with <=, the count is b - a + 1 = 19 - 4 + 1 = 16.","id":"2.8-d2du8v"},{"t":"bug","topic":"2.8","task":"Should print 1 2 3 4 5.","code":"for (int i = 1; i < 5; i++) {\n    System.out.print(i + \" \");\n}","bug":1,"fix":"for (int i = 1; i <= 5; i++) {","expect":"1 2 3 4 5","why":"Off by one: i < 5 stops at 4. Use i <= 5 (or i < 6) to include 5.","id":"2.8-17w2ncz","fixed":"for (int i = 1; i <= 5; i++) {\n    System.out.print(i + \" \");\n}","bugOut":"1 2 3 4"},{"t":"fill","topic":"2.8","task":"Print the multiples of 5 up to 25: 5 10 15 20 25","code":"for (int i = 5; ____; i += 5) {\n    System.out.print(i + \" \");\n}","opts":["i <= 25","i < 25","i == 25","i <= 30"],"expect":"5 10 15 20 25","why":"i goes 5, 10, 15, 20, 25. i < 25 would stop before 25 and i <= 30 would include 30.","id":"2.8-tohbvr","optOut":["5 10 15 20 25","5 10 15 20","(nothing printed)","5 10 15 20 25 30"]},{"t":"mc","topic":"2.8","q":"Which while loop does exactly what this for loop does?","code":"for (int i = 0; i < 3; i++) {\n    System.out.print(i);\n}","answer":"int i = 0; while (i < 3) { System.out.print(i); i++; }","wrong":["int i = 0; while (i < 3) { i++; System.out.print(i); }","int i = 0; while (i <= 3) { System.out.print(i); i++; }","int i = 1; while (i < 3) { System.out.print(i); i++; }"],"why":"Init above the loop, same condition, body first, update last. Updating before printing would print 123 instead of 012.","id":"2.8-j8rtaq"},{"t":"trace","topic":"2.9","code":"int sum = 0;\nfor (int i = 1; i <= 10; i++) {\n    if (i % 2 == 0) {\n        sum += i;\n    }\n}\nSystem.out.println(sum);","wrong":["55","25","20"],"why":"Adds only the evens: 2 + 4 + 6 + 8 + 10 = 30.","id":"2.9-1yl70fw","answer":"30"},{"t":"trace","topic":"2.9","code":"int count = 0;\nfor (int n = 1; n <= 30; n++) {\n    if (n % 4 == 0 || n % 6 == 0) {\n        count++;\n    }\n}\nSystem.out.println(count);","wrong":["12","5","7"],"why":"Multiples of 4: 7 of them (4 to 28). Multiples of 6: 5 (6 to 30). Overlap (12, 24) counted once: 7 + 5 - 2 = 10.","id":"2.9-kcetsy","answer":"10"},{"t":"trace","topic":"2.9","code":"int product = 1;\nfor (int i = 1; i <= 5; i++) {\n    product *= i;\n}\nSystem.out.println(product);","wrong":["15","0","24"],"why":"1 × 2 × 3 × 4 × 5 = 120 (5 factorial). A product starts at 1, not 0, or everything would be 0.","id":"2.9-csp6vu","answer":"120"},{"t":"trace","topic":"2.9","code":"int min = Integer.MAX_VALUE;\nint a = 8, b = 3, c = 5;\nif (a < min) { min = a; }\nif (b < min) { min = b; }\nif (c < min) { min = c; }\nSystem.out.println(min);","wrong":["5","8","2147483647"],"why":"Starting at the largest int guarantees the first value replaces it. Then 3 beats 8, and 5 does not beat 3.","id":"2.9-1besy8c","answer":"3"},{"t":"bug","topic":"2.9","task":"Should print the product 1×2×3×4 = 24.","code":"int product = 0;\nfor (int i = 1; i <= 4; i++) {\n    product *= i;\n}\nSystem.out.println(product);","bug":1,"fix":"int product = 1;","expect":"24","why":"Anything times 0 is 0. A product accumulator must start at 1.","id":"2.9-gv98t","fixed":"int product = 1;\nfor (int i = 1; i <= 4; i++) {\n    product *= i;\n}\nSystem.out.println(product);","bugOut":"0"},{"t":"fill","topic":"2.9","task":"Count the numbers from 1 to 50 that are divisible by 7 (should print 7).","code":"int count = 0;\nfor (int n = 1; n <= 50; n++) {\n    if (____) {\n        count++;\n    }\n}\nSystem.out.println(count);","opts":["n % 7 == 0","n / 7 == 0","n % 7 == 1","n == 7"],"expect":"7","why":"Divisible by 7 means remainder 0. Those are 7, 14, ..., 49: seven numbers.","id":"2.9-1s4bol9","optOut":["7","6","8","1"]},{"t":"trace","topic":"2.9","code":"int n = 12;\nfor (int d = 1; d <= n; d++) {\n    if (n % d == 0) {\n        System.out.print(d + \" \");\n    }\n}\nSystem.out.println();","wrong":["2 3 4 6","1 2 3 4 6","12 6 4 3 2 1"],"why":"Prints every d that divides 12 evenly, from 1 up to 12 itself: all the factors.","id":"2.9-1eebasq","answer":"1 2 3 4 6 12"},{"t":"trace","topic":"2.10","code":"String s = \"loop\";\nString out = \"\";\nfor (int i = 0; i < s.length(); i++) {\n    out = s.substring(i, i + 1) + out;\n}\nSystem.out.println(out);","wrong":["loop","opol","p"],"why":"Each new letter goes in FRONT of what we have so far: l, ol, ool, pool. It reverses the word.","id":"2.10-uhr5jo","answer":"pool"},{"t":"trace","topic":"2.10","code":"String s = \"banana\";\nint count = 0;\nfor (int i = 0; i < s.length(); i++) {\n    if (s.substring(i, i + 1).equals(\"a\")) {\n        count++;\n    }\n}\nSystem.out.println(count);","wrong":["2","6","1"],"why":"Checks each letter: a appears at indexes 1, 3, 5. Three times.","id":"2.10-1k4nflf","answer":"3"},{"t":"trace","topic":"2.10","code":"String s = \"computer\";\nString result = \"\";\nfor (int i = 0; i < s.length(); i += 2) {\n    result += s.substring(i, i + 1);\n}\nSystem.out.println(result);","wrong":["optr","cmpt","computer"],"why":"i = 0, 2, 4, 6: letters c, m, u, e. Every other letter starting at 0.","id":"2.10-9i92zc","answer":"cmue"},{"t":"trace","topic":"2.10","code":"String s = \"hi\";\nfor (int i = 0; i <= s.length(); i++) {\n    System.out.print(s.substring(i, i + 1));\n}","wrong":["hi","h\ni","Crash: StringIndexOutOfBoundsException"],"why":"With <= the loop tries i = 2, and substring(2, 3) is past the end of \"hi\". It prints h and i, then crashes with StringIndexOutOfBoundsException.","id":"2.10-dor8i8","answer":"hi\nCrash: StringIndexOutOfBoundsException"},{"t":"trace","topic":"2.10","code":"String s = \"a,b,,c\";\nint pos = s.indexOf(\",\");\nint count = 0;\nwhile (pos >= 0) {\n    count++;\n    s = s.substring(pos + 1);\n    pos = s.indexOf(\",\");\n}\nSystem.out.println(count + \" \" + s);","wrong":["3 ,c","2 c","4 c"],"why":"Each pass removes everything up to and including the next comma. There are 3 commas, and the last chop leaves \"c\".","id":"2.10-1em9rm4","answer":"3 c"},{"t":"bug","topic":"2.10","task":"Should count the vowels in \"education\" (5).","code":"String word = \"education\";\nString vowels = \"aeiou\";\nint count = 0;\nfor (int i = 0; i < word.length(); i++) {\n    String ch = word.substring(i, i + 1);\n    if (vowels.indexOf(ch) > 0) {\n        count++;\n    }\n}\nSystem.out.println(count);","bug":6,"fix":"    if (vowels.indexOf(ch) >= 0) {","expect":"5","why":"indexOf returns 0 when the letter is \"a\" (it is at index 0 of \"aeiou\"). Not found is -1, so the test must be >= 0 (or != -1).","id":"2.10-rdkews","fixed":"String word = \"education\";\nString vowels = \"aeiou\";\nint count = 0;\nfor (int i = 0; i < word.length(); i++) {\n    String ch = word.substring(i, i + 1);\n    if (vowels.indexOf(ch) >= 0) {\n        count++;\n    }\n}\nSystem.out.println(count);","bugOut":"4"},{"t":"fill","topic":"2.10","task":"Print each letter of \"abc\" on its own line.","code":"String s = \"abc\";\nfor (int i = 0; i < s.length(); i++) {\n    System.out.println(____);\n}","opts":["s.substring(i, i + 1)","s.substring(i)","s.substring(i, i)","s.substring(0, i)"],"expect":"a\nb\nc","why":"substring(i, i + 1) is exactly one letter. substring(i) is everything from i on, and substring(i, i) is empty.","id":"2.10-45ezmt","optOut":["a\nb\nc","abc\nbc\nc","(nothing printed)","\na\nab"]},{"t":"trace","topic":"2.11","code":"for (int i = 1; i <= 2; i++) {\n    for (int j = 1; j <= 3; j++) {\n        System.out.print(i * j + \" \");\n    }\n    System.out.println();\n}","wrong":["1 2 3 2 4 6","1 2\n2 4\n3 6","1 1 1\n2 2 2"],"why":"For i = 1, j runs 1 to 3: 1 2 3. New line. For i = 2: 2 4 6.","id":"2.11-13ycsu","answer":"1 2 3\n2 4 6"},{"t":"trace","topic":"2.11","code":"for (int i = 3; i >= 1; i--) {\n    for (int j = 0; j < i; j++) {\n        System.out.print(\"#\");\n    }\n    System.out.println();\n}","wrong":["#\n##\n###","###\n###\n###","###\n##"],"why":"Inner loop runs i times. i goes 3, 2, 1, so rows have 3, 2, 1 #s.","id":"2.11-jq4d9y","answer":"###\n##\n#"},{"t":"trace","topic":"2.11","code":"int count = 0;\nfor (int i = 0; i < 4; i++) {\n    for (int j = i; j < 4; j++) {\n        count++;\n    }\n}\nSystem.out.println(count);","wrong":["16","4","6"],"why":"j starts at i each time: i = 0 → 4 passes, i = 1 → 3, i = 2 → 2, i = 3 → 1. 4 + 3 + 2 + 1 = 10.","id":"2.11-1y6lub9","answer":"10"},{"t":"trace","topic":"2.11","code":"for (int r = 1; r <= 3; r++) {\n    String line = \"\";\n    for (int c = 1; c <= r; c++) {\n        line += c;\n    }\n    System.out.println(line);\n}","wrong":["1\n2\n3","123\n123\n123","1\n12"],"why":"line resets to \"\" every row. Row r builds 1..r: \"1\", \"12\", \"123\".","id":"2.11-178suvj","answer":"1\n12\n123"},{"t":"fill","topic":"2.11","task":"Print a 2-row by 4-column rectangle of *.","code":"for (int row = 0; row < 2; row++) {\n    for (int col = 0; col < 4; col++) {\n        System.out.print(\"*\");\n    }\n    ____\n}","opts":["System.out.println();","System.out.print(\"*\");","row++;","col = 0;"],"expect":"****\n****","why":"After the inner loop finishes a row, println() moves to the next line. Without it, all 8 stars would be on one line.","id":"2.11-8zktaj","optOut":["****\n****","**********","****","Compile error"]},{"t":"mc","topic":"2.12","q":"How many times does count++ execute?","code":"for (int i = 0; i < 5; i++) {\n    for (int j = 0; j < 3; j++) {\n        count++;\n    }\n}","answer":"15","wrong":["8","5","18"],"why":"The inner loop runs 3 times for each of the 5 outer passes: 5 × 3 = 15.","id":"2.12-6sbgs9"},{"t":"mc","topic":"2.12","q":"How many times does the body run?","code":"for (int k = 1; k < 64; k *= 2)","answer":"6","wrong":["64","32","7"],"why":"k = 1, 2, 4, 8, 16, 32. Next would be 64, which fails k < 64. Six passes.","id":"2.12-2y2djt"},{"t":"mc","topic":"2.12","q":"How many times does x++ execute?","code":"for (int i = 1; i <= 5; i++) {\n    for (int j = 1; j <= i; j++) {\n        x++;\n    }\n}","answer":"15","wrong":["25","5","10"],"why":"Row i runs i times: 1 + 2 + 3 + 4 + 5 = 15.","id":"2.12-ofcfcd"},{"t":"mc","topic":"2.12","q":"How many times does the body run?","code":"for (int i = 10; i > 0; i -= 3)","answer":"4","wrong":["3","10","5"],"why":"i = 10, 7, 4, 1 all pass i > 0. Next is -2, which fails. Four passes.","id":"2.12-14c5973"},{"t":"mc","topic":"2.12","q":"How many times is the condition i < 4 checked in total?","code":"for (int i = 0; i < 4; i++)","answer":"5","wrong":["4","3","1"],"why":"It is checked before each of the 4 passes, plus once more when i = 4 and it finally fails. Loop runs n times, condition checks n + 1 times.","id":"2.12-77ks25"}],"presets":[{"name":"Digit sum (while)","code":"int num = 4721;\nint sum = 0;\nwhile (num > 0) {\n    sum += num % 10;\n    num /= 10;\n}\nSystem.out.println(sum);"},{"name":"FizzBuzz 1 to 15","code":"for (int i = 1; i <= 15; i++) {\n    if (i % 3 == 0 && i % 5 == 0) {\n        System.out.println(\"FizzBuzz\");\n    } else if (i % 3 == 0) {\n        System.out.println(\"Fizz\");\n    } else if (i % 5 == 0) {\n        System.out.println(\"Buzz\");\n    } else {\n        System.out.println(i);\n    }\n}"},{"name":"Reverse a word","code":"String s = \"racecar\";\nString rev = \"\";\nfor (int i = 0; i < s.length(); i++) {\n    rev = s.substring(i, i + 1) + rev;\n}\nSystem.out.println(rev);\nSystem.out.println(rev.equals(s));"},{"name":"Methods and return","code":"public class Main {\n    public static int max(int a, int b) {\n        if (a > b) {\n            return a;\n        }\n        return b;\n    }\n\n    public static void main(String[] args) {\n        int best = max(4, 9);\n        best = max(best, 7);\n        System.out.println(best);\n    }\n}"},{"name":"Star triangle (nested)","code":"for (int i = 1; i <= 4; i++) {\n    for (int j = 1; j <= i; j++) {\n        System.out.print(\"*\");\n    }\n    System.out.println();\n}"},{"name":"Blank","code":"int x = 5;\nSystem.out.println(x);"}]};

<script>
{
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const TOPICS = DATA.topics, QS = DATA.questions, PRESETS = DATA.presets, PROBS = DATA.problems;
const byTopic = id => TOPICS.find(t => t.id === id);
const NOTES = new Set(['1.3', '1.4', '1.5', '1.6', '1.9', '1.11', '1.12', '2.1', '2.2', '2.3', '2.4', '2.5', '2.6', '2.7', '2.9']);
const UNITS = { 1: 'Unit 1: Using objects and methods', 2: 'Unit 2: Selection and iteration' };
const KIND = { trace: 'Trace the code', bug: 'Bug hunt', fill: 'Fill the blank', mc: 'Concept check' };
const VERSION = 'v1.2';

/* ---------- saved progress ---------- */
const KEY = 'chronicle-csa-v1';
let S = { q: {}, read: {}, draft: null, w: {}, wd: {} };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const DAY = 864e5, GAPS = [1, 3, 7, 14];
function grade(id, ok) {
  const r = S.q[id] || { s: 0, n: 0, w: 0, due: null };
  r.n++;
  if (!ok) { r.s = 0; r.w++; r.due = Date.now(); }
  else { r.s++; r.due = r.w > 0 && r.s <= GAPS.length ? Date.now() + GAPS[r.s - 1] * DAY : null; }
  S.q[id] = r; save();
}
const isDue = q => { const r = S.q[q.id]; return !!(r && r.due && r.due <= Date.now()); };
const strength = q => { const r = S.q[q.id]; if (!r) return 0; if (isDue(q)) return 0.15; if (r.s >= 2) return 1; if (r.s === 1) return r.w ? 0.55 : 0.7; return 0.15; };
const topicQs = id => QS.filter(q => q.topic === id);
const topicPct = id => { const qs = topicQs(id); return qs.length ? qs.reduce((a, q) => a + strength(q), 0) / qs.length : 0; };
const dueList = () => QS.filter(isDue);
const solid = () => QS.filter(q => strength(q) >= 0.7).length;
const solvedN = () => PROBS.filter(p => S.w[p.id] && S.w[p.id].solved).length;
let sampleFn = null;
try { if (window.claude && window.claude.use) window.claude.use('sample').then(f => { sampleFn = f; const b = document.getElementById('wask'); if (b && f) b.hidden = false; }).catch(() => {}); } catch (e) {}


/* ---------- sound: synthesized 8-bit / terminal sounds, no audio files ---------- */
const SFX = (() => {
  let ctx = null, on = S.sound !== false, lastStep = 0;
  const ac = () => {
    if (!ctx) { const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; try { ctx = new C(); } catch (e) { return null; } }
    if (ctx.state === 'suspended') ctx.resume().catch(() => {});
    return ctx;
  };
  function blip(c, f, t, dur, o = {}) {
    const osc = c.createOscillator(), g = c.createGain(), vol = o.vol ?? 0.05;
    osc.type = o.type || 'square'; osc.frequency.setValueAtTime(f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.setValueAtTime(vol, t + dur * 0.7); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    let out = g;
    if (o.lp) { const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = o.lp; g.connect(fl); out = fl; }
    osc.connect(g); out.connect(c.destination); osc.start(t); osc.stop(t + dur + 0.02);
  }
  function click(c, t, o = {}) {
    const len = Math.floor(c.sampleRate * (o.dur || 0.018)), buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
    const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; f.type = 'highpass'; f.frequency.value = o.hp || 3200; g.gain.value = o.vol || 0.22;
    src.connect(f).connect(g).connect(c.destination); src.start(t);
  }
  const arp = (c, t, notes, gap, dur, vol, type) => notes.forEach((f, i) => blip(c, f, t + i * gap, dur, { vol, type }));
  const SND = {
    tap: (c, t) => click(c, t),
    key: (c, t) => click(c, t, { dur: 0.012, hp: 4200, vol: 0.14 }),
    step: (c, t) => blip(c, 1320, t, 0.028, { vol: 0.025 }),
    back: (c, t) => blip(c, 990, t, 0.028, { vol: 0.025 }),
    rewind: (c, t) => blip(c, 1400, t, 0.12, { vol: 0.03, to: 300 }),
    ff: (c, t) => blip(c, 300, t, 0.12, { vol: 0.03, to: 1400 }),
    done: (c, t) => arp(c, t, [784, 1047], 0.07, 0.08, 0.04),
    crash: (c, t) => { blip(c, 160, t, 0.09, { vol: 0.06, type: 'sawtooth', lp: 900 }); blip(c, 120, t + 0.11, 0.16, { vol: 0.06, type: 'sawtooth', lp: 900 }); },
    right: (c, t) => arp(c, t, [1047, 1568], 0.07, 0.09, 0.045),
    wrong: (c, t) => { blip(c, 196, t, 0.11, { vol: 0.05 }); blip(c, 147, t + 0.12, 0.2, { vol: 0.05 }); },
    streak: (c, t) => arp(c, t, [1047, 1319, 1568, 2093, 2637], 0.045, 0.06, 0.035),
    run: (c, t) => blip(c, 500, t, 0.09, { vol: 0.035, to: 1600 }),

const IC = {

function seeded(n) { let s = n; return () => (s = s * 16807 % 2147483647) / 2147483647; }

function mountDebugger(host, code) {
  const r = JavaEngine.run(code, { random: seeded(11) });
  const steps = [{ line: null, note: 'Ready. Press Step (or the right arrow key) to run the first line.', out: '', frames: [{ name: 'main', vars: [] }], changed: null }].concat(r.steps);
  if (r.error && r.error.kind === 'compile') {

      <button class="ib" data-a="back" aria-label="Step back" title="Step back">${IC.back}</button>

      if (top < pane.scrollTop + 10 || top > pane.scrollTop + pane.clientHeight - 40) pane.scrollTop = Math.max(0, top - pane.clientHeight / 2);
    }

  }

    const was = i; i = Math.max(0, Math.min(steps.length - 1, n)); show();

  P.answered = true; P.res.push(ok); grade(q.id, ok); renderTree(location.hash.slice(1));
  streak = ok ? streak + 1 : 0;
  SFX.play(ok ? 'right' : 'wrong');
  if (ok && streak > 0 && streak % 3 === 0) SFX.play('streak', 0.22);
  const dot = document.querySelectorAll('.dots i')[P.res.length - 1]; if (dot) dot.className = ok ? 'ok' : 'bad';
  const more = q.t === 'bug' ? `<p>Line ${q.bug} should be: <code>${esc(q.fix.trim())}</code><br>The buggy version printed: <code>${esc(q.bugOut)}</code></p>` : '';
  const watch = q.t === 'trace' ? q.code : q.t === 'fill' ? q.code.replace('____', q.opts[0]) : q.t === 'bug' ? q.fixed : null;
  $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}"><h4>${ok ? 'Correct' : 'Not quite'}</h4><p>${esc(q.why)}</p>${more}
    <div class="row">${q.t === 'bug' ? '<button class="btn" id="wb">Watch the buggy version</button>' : ''}${watch ? `<button class="btn" id="ww">${q.t === 'bug' ? 'Watch the fixed version' : 'Step through it'}</button>` : ''}<button class="btn pri" id="nx">${P.i + 1 < P.qs.length ? 'Next question' : 'See results'}</button></div><div id="wv"></div></div>`;
  if (watch) $('#ww').onclick = () => { mountDebugger($('#wv'), watch); };
  if (q.t === 'bug') $('#wb').onclick = () => { mountDebugger($('#wv'), q.code); };
  $('#nx').onclick = () => { P.i++; viewQuestion(); $('#main').scrollTop = 0; };
  $('#nx').focus({ preventScroll: true });
}
function viewDone() {
  const right = P.res.filter(Boolean).length;
  if (!P.played) { P.played = true; SFX.play(right / P.qs.length >= 0.7 ? 'win' : 'lose', 0.1); }
  const missed = P.qs.map(id => QS.find(q => q.id === id)).filter((q, k) => !P.res[k]);
  $('#view').innerHTML = `<h1>${esc(P.title)}: done</h1>
    <div class="row" style="gap:18px;margin:10px 0 18px"><div class="score">${right}/${P.qs.length}</div><p style="margin:0;color:var(--muted);max-width:40ch">${right === P.qs.length ? 'Clean sweep.' : missed.length + ' went to your review pile. They come back until you get them right a few times in a row.'}</p></div>
    <div class="row"><button class="btn pri" id="again">${P.review ? 'Review more' : 'Another round'}</button><a class="btn" href="#review">Review pile (${dueList().length})</a><a class="btn" href="#home">Home</a></div>
    ${missed.length ? '<h2 style="margin-top:28px">What you missed</h2>' + missed.map(q => `<div class="miss"><b>${esc(q.topic)} ${KIND[q.t]}:</b> ${esc(q.q || q.task || 'What does this print?')}<br><span style="color:var(--muted)">${esc(q.why)}</span></div>`).join('') : ''}`;
  $('#again').onclick = () => P.review ? startReview() : startSession({ ...setup });
}
function startReview() { const d = shuffle(dueList()).slice(0, 15); if (!d.length) { P = null; location.hash = 'review'; route(); return; } startSession(setup, d, 'Review pile'); }
function viewReview() {
  if (P && P.review) return viewQuestion();
  const d = dueList();
  $('#view').innerHTML = `<h1>Review pile</h1><p class="lede">Questions you missed come back here right away, then again after 1, 3, 7 and 14 days once you get them right.</p>
    ${d.length ? `<button class="btn pri" id="rs">Review ${Math.min(d.length, 15)} now</button>` : '<p>Nothing due right now. Missed questions will show up here.</p><a class="btn pri" href="#practice">Go practice</a>'}`;
  if (d.length) $('#rs').onclick = startReview;
}


/* ---------- write code ---------- */
const wrapW = (code, call, kind) => 'public class Main {\n' + code.split('\n').map(l => '    ' + l).join('\n') + '\n    public static void main(String[] args) {\n        ' + (kind === 'print' ? call + ';' : 'System.out.println(' + call + ');') + '\n    }\n}';
const normOut = t => t.split('\n').map(l => l.replace(/\s+$/, '')).join('\n').replace(/\n+$/, '');
const retType = p => p.sig.split('(')[0].trim().split(/\s+/).slice(-2)[0];
const showVal = (p, v) => p.kind === 'return' && retType(p) === 'String' && !/^Crash: |^Compile error|^Runs forever/.test(v) ? JSON.stringify(v) : v;
function runTest(p, code, call) {
  const r = JavaEngine.run(wrapW(code, call, p.kind), { record: false, maxSteps: 60000 });
  if (r.error && r.error.kind === 'compile') return { compile: r.error };
  if (r.error && r.error.kind === 'Timeout') return { got: 'Runs forever', err: 'Your loop never stopped (stopped it after 60,000 steps).' };
  const o = normOut(r.out);
  if (r.error) return { got: (o ? o + '\n' : '') + 'Crash: ' + r.error.kind, err: r.error.kind + ': ' + r.error.msg };
  return { got: o };
}
const wStatus = p => { const r = S.w[p.id]; return !r ? 'New' : r.solved ? 'Solved' : 'Tried'; };
function viewWriteList() {
  const byT = TOPICS.filter(t => PROBS.some(p => p.topic === t.id));
  $('#view').innerHTML = `<h1>Write code</h1>
    <p class="lede">On the AP exam, 4 free-response questions are 45% of your score, and every one of them is writing Java methods. Write each method below, run the tests, and step through your own code when a test fails. ${solvedN()} of ${PROBS.length} solved.</p>
    ${byT.map(t => `<div class="prog" style="margin-bottom:16px"><h3>${t.id} ${esc(t.title)}</h3>${PROBS.filter(p => p.topic === t.id).map(p => { const st = wStatus(p); return `<a class="pr wr" href="#write-${p.id}"><span class="id">${p.kind === 'print' ? 'void' : esc(retType(p))}</span><span>${esc(p.title)}</span><span class="st st-${st.toLowerCase()}">${st}</span></a>`; }).join('')}</div>`).join('')}`;
}
function viewWrite(id) {
  const p = PROBS.find(x => x.id === id); if (!p) return viewWriteList();
  const t = byTopic(p.topic), idx = PROBS.indexOf(p), nx = PROBS[idx + 1];
  const starter = p.sig + ' {\n    \n}';
  const rec = S.w[p.id] || {};
  let hintN = 0, solArmed = false;
  $('#view').innerHTML = `<span class="src">Write it · ${t.id} ${esc(t.title)}${rec.solved ? ' · Solved' : ''}</span>
    <h1>${esc(p.title)}</h1>
    <p class="task" style="font-size:17px">${p.prompt}</p>
    <h3>Examples</h3>
    <div class="exs">${p.tests.slice(0, 2).map((c, k) => `<div class="exr"><code>${esc(c)}</code><span>${p.kind === 'print' ? 'prints' : 'returns'}</span><pre>${esc(showVal(p, p.expect[k])) || ' '}</pre></div>`).join('')}</div>
    <h3 style="margin-top:18px">Your code</h3>
    <textarea class="ed" id="wed" spellcheck="false" aria-label="Your method" style="min-height:240px">${esc(S.wd[p.id] || starter)}</textarea>
    <div class="row" style="margin-top:10px">
      <button class="btn pri" id="wrun">Run tests</button>
      <button class="btn" id="whb">Hint (0/${p.hints.length})</button>
      <button class="btn" id="wask" hidden>Ask Claude to review</button>
      <button class="btn" id="wsb">Show solution</button>
      <button class="btn" id="wreset">Reset code</button>
    </div>
    <div id="whint"></div><div id="wres"></div><div id="wclaude"></div><div id="wsol"></div>
    ${nx ? `<div class="row" style="border-top:1px solid var(--line);margin-top:28px;padding-top:20px"><a class="btn" href="#write-${nx.id}">Next: ${esc(nx.title)}</a><a class="btn" href="#write">All problems</a></div>` : ''}`;
  const ed = $('#wed');
  if (sampleFn) $('#wask').hidden = false;
  ed.addEventListener('input', () => { S.wd[p.id] = ed.value; save(); });
  ed.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); ed.setRangeText('    ', ed.selectionStart, ed.selectionEnd, 'end'); S.wd[p.id] = ed.value; save(); } });
  $('#wreset').onclick = () => { ed.value = starter; S.wd[p.id] = starter; save(); $('#wres').innerHTML = ''; };
  $('#whb').onclick = () => {
    if (hintN < p.hints.length) { hintN++; SFX.play('hint'); }
    $('#whb').textContent = `Hint (${hintN}/${p.hints.length})`;
    $('#whint').innerHTML = `<div class="trap" style="margin-top:14px">${p.hints.slice(0, hintN).map((h, k) => `<div><b>Hint ${k + 1}:</b>${esc(h)}</div>`).join('')}</div>`;
  };
  $('#wsb').onclick = () => {
    if (!solArmed) { solArmed = true; $('#wsb').textContent = 'Sure? Click again to show it'; return; }
    S.w[p.id] = Object.assign(S.w[p.id] || {}, { saw: true }); save(); renderTree(location.hash.slice(1));
    SFX.play('reveal');
    $('#wsol').innerHTML = `<div class="fb" style="margin-top:16px"><h4>Reference solution</h4><p>${esc(p.explain)}</p>${codeHTML(p.solution)}<p style="margin-top:10px;color:var(--muted)">Now close it, wait a minute, and write it yourself from memory. Reading a solution is not the same as being able to write it.</p></div>`;
    $('#wsb').textContent = 'Solution shown';
  };
  let last = null;
  $('#wrun').onclick = () => {
    const code = ed.value;
    if (code.trim() === starter.trim()) { SFX.play('wrong'); $('#wres').innerHTML = '<div class="fb bad"><h4>Write your code first</h4><p>Put your code between the { and }. Stuck? Press Hint.</p></div>'; return; }
    S.w[p.id] = Object.assign(S.w[p.id] || {}, { tries: ((S.w[p.id] || {}).tries || 0) + 1 });
    const results = [];
    for (const call of p.tests) {
      const r = runTest(p, code, call);
      if (r.compile) {
        const L = r.compile.line, n = code.split('\n').length;
        const where = L && L >= 2 && L <= n + 1 ? 'line ' + (L - 1) + ' of your code' : 'your code';
        last = { compile: r.compile.msg };
        SFX.play('compile');
        $('#wres').innerHTML = `<div class="fb bad"><h4>Compile error in ${where}</h4><p><code>${esc(r.compile.msg)}</code></p><p>Java will not run any of it until this is fixed. On the AP exam small syntax slips cost little, but here the tests cannot run.</p></div>`;
        save(); renderTree(location.hash.slice(1));
        return;
      }
      results.push({ call, exp: p.expect[results.length], got: r.got, err: r.err });
    }
    const pass = results.filter(r => r.got === r.exp).length, all = pass === results.length;
    last = { results, pass };
    if (all) S.w[p.id].solved = true;
    SFX.play(all ? 'pass' : 'fail');
    save(); renderTree(location.hash.slice(1));
    $('#wres').innerHTML = `<div class="fb ${all ? 'ok' : 'bad'}"><h4>${all ? 'All ' + pass + ' tests pass' : pass + ' of ' + results.length + ' tests pass'}</h4>
      ${all ? `<p>${esc(p.explain)}</p>` : '<p>Pick a failing test and press Step through to watch your code run on it.</p>'}
      <div class="tests">${results.map((r, k) => { const ok = r.got === r.exp; return `<div class="tr ${ok ? 'tp' : 'tf'}"><span class="tm">${ok ? 'Pass' : 'Fail'}</span><code>${esc(r.call)}</code><div><span class="tl">expected</span><pre>${esc(showVal(p, r.exp)) || ' '}</pre></div><div><span class="tl">got</span><pre>${esc(showVal(p, r.got)) || ' '}</pre></div><button class="btn sm" data-st="${k}">Step through</button></div>`; }).join('')}</div>
      ${all && !(S.w[p.id] || {}).saw ? '<details style="margin-top:12px"><summary>Compare with the reference solution</summary>' + codeHTML(p.solution) + '</details>' : ''}
      <div id="wdbg"></div></div>`;
    $('#wres').querySelectorAll('[data-st]').forEach(b => b.onclick = () => { mountDebugger($('#wdbg'), wrapW(code, results[+b.dataset.st].call, p.kind)); });
  };
  $('#wask').onclick = async () => {
    if (!sampleFn) return;
    const code = ed.value, box = $('#wclaude'), btn = $('#wask');
    if (!last) $('#wrun').click();
    const res = last && last.compile ? 'Compile error: ' + last.compile : last ? last.results.map(r => `${r.call}: expected ${showVal(p, r.exp) || '(nothing)'}, got ${showVal(p, r.got) || '(nothing)'} ${r.got === r.exp ? 'PASS' : 'FAIL'}`).join('\n') : 'not run';
    const allPass = last && last.results && last.pass === last.results.length;
    const promptText = `You are an AP Computer Science A tutor reviewing a high school student's Java method. Be direct and specific, like a good teacher. Plain text only, no markdown headings or bullet symbols, no em dashes, under 140 words.

Problem: ${p.prompt.replace(/<[^>]+>/g, '')}
Method header: ${p.sig}

Student's code:
${code}

Automated test results:
${res}

${allPass ? 'All tests pass. Say whether this would earn full credit on an AP free-response question, and point out one habit worth keeping or one thing to clean up (naming, unneeded code, risky patterns). Do not rewrite their whole method.' : 'Some tests fail or it does not compile. Explain what their code actually does wrong, pointing to the specific line or expression, and connect it to the failing test. Give one hint toward the fix. Do NOT write the corrected code for them.'}`;
    btn.disabled = true; btn.textContent = 'Claude is reading your code...';
    box.innerHTML = '<div class="fb claude" style="margin-top:16px"><h4>Claude\'s review</h4><p class="ct"></p></div>';
    const out = box.querySelector('.ct');
    try {
      const r = await sampleFn(promptText, { onText: ({ text }) => { out.textContent = text; }, modelTier: 'default' });
      out.textContent = r.text;
      SFX.play('msg');
    } catch (e) {
      out.textContent = e && e.code === 'rate_limited' ? 'Too many reviews in a row. Wait a minute and try again.' : e && e.code === 'not_granted' ? 'Claude reviews are not available here.' : 'Could not get a review right now.';
      if (e && e.code === 'not_granted') btn.hidden = true;
    }
    btn.disabled = false; btn.textContent = 'Ask Claude to review';
  };
}

/* ---------- playground ---------- */
function viewPlayground() {
  const code = S.draft || PRESETS[0].code;
  $('#view').innerHTML = `<h1>Playground</h1><p class="lede">Write your own code and step through it. Works with int, double, boolean, String, Math, if, while, for, and static methods (everything in Units 1 and 2).</p>
    <div class="row" style="margin-bottom:10px"><select id="pre" aria-label="Load an example"><option value="">Load an example...</option>${PRESETS.map((p, i) => `<option value="${i}">${esc(p.name)}</option>`).join('')}</select></div>
    <textarea class="ed" id="ed" spellcheck="false" aria-label="Java code">${esc(code)}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn" id="run">Run</button><button class="btn pri" id="stp">Step through</button></div>
    <div id="pout"></div>`;
  const ed = $('#ed');
  ed.addEventListener('input', () => { S.draft = ed.value; save(); });
  ed.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); const s = ed.selectionStart; ed.setRangeText('    ', s, ed.selectionEnd, 'end'); S.draft = ed.value; save(); } });
  $('#pre').onchange = e => { if (e.target.value === '') return; ed.value = PRESETS[+e.target.value].code; S.draft = ed.value; save(); $('#pout').innerHTML = ''; };
  $('#run').onclick = () => { const r = quickRun(ed.value); SFX.play(r.bad ? (r.text.startsWith('Compile') ? 'compile' : 'crash') : 'run'); $('#pout').innerHTML = `<div class="con" style="padding:12px 0 0"><h5>Console output</h5><pre>${r.bad ? '' : esc(r.text)}${r.bad ? '<span class="er">' + esc(r.text) + '</span>' : ''}</pre></div>`; };
  $('#stp').onclick = () => mountDebugger($('#pout'), ed.value);
}

/* ---------- routing ---------- */
const FILES = { home: 'Home.java', practice: 'Practice.java', review: 'ReviewPile.java', playground: 'Playground.java', write: 'WriteCode.java' };
function route() {
  const h = location.hash.slice(1) || 'home';
  renderTree(h);
  if (h.startsWith('write-')) { const p = PROBS.find(x => x.id === h.slice(6)); $('#tab').textContent = p ? p.sig.split('(')[0].trim().split(/\s+/).pop() + '.java' : 'WriteCode.java'; renderTree('write'); viewWrite(h.slice(6)); }
  else if (h.startsWith('learn-')) { const id = h.slice(6).replace('-', '.'); const t = byTopic(id); $('#tab').textContent = t ? t.file : 'Home.java'; viewLearn(id); }
  else {
    $('#tab').textContent = FILES[h] || 'Home.java';
    if (h === 'practice') { if (P && !P.review) viewQuestion(); else viewPracticeSetup(); }
    else if (h === 'review') viewReview();
    else if (h === 'playground') viewPlayground();
    else if (h === 'write') viewWriteList();
    else viewHome();
  }
  $('#app').classList.remove('open');
  $('#main').scrollTop = 0;
}
window.addEventListener('hashchange', () => { if (P && P.i >= P.qs.length && !location.hash.match(/practice|review/)) P = null; route(); });
$('#menu').onclick = () => $('#app').classList.toggle('open');
$('#snd').onclick = e => { e.stopPropagation(); SFX.toggle(); };
SFX.sync();
document.addEventListener('click', e => {
  const b = e.target.closest && e.target.closest('.tree a, .chip, .btn, .pr, .menu');
  if (!b || b.disabled || b.id === 'snd') return;
  if (['wrun', 'run', 'whb', 'wsb', 'wask'].includes(b.id) || b.dataset.run !== undefined) return;
  SFX.play('tap');
}, true);
document.addEventListener('input', e => { if (e.target.classList && e.target.classList.contains('ed')) SFX.play('key'); });
$('#scrim').onclick = () => $('#app').classList.remove('open');
$('#tree').addEventListener('click', e => {
  const a = e.target.closest('a'); if (!a) return;
  const h = a.getAttribute('href').slice(1);
  if (h === 'practice' && P && P.i >= P.qs.length) P = null;
  if (h === 'practice' && P && P.review) P = null;
  if (h === location.hash.slice(1)) route();
});
document.addEventListener('keydown', e => {
  if (!P || !/^(practice|review)$/.test(location.hash.slice(1)) || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  const k = 'abcd1234'.indexOf(e.key.toLowerCase());
  if (k >= 0 && !P.answered) { const b = document.querySelector(`.opt[data-k="${k % 4}"]`); if (b) b.click(); }
  if (e.key === 'Enter' && P.answered && document.activeElement.id !== 'nx') { const n = $('#nx'); if (n) n.click(); }
});
route();
}

</script>
