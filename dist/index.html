<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSA Lab</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 22'><rect x='1' y='1' width='20' height='20' rx='5' fill='%232346e8'/><path d='M8 6 L4.5 11 L8 16 M14 6 L17.5 11 L14 16' stroke='%23fff' stroke-width='2.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study tool, calm and exact
   IDEA an IDE with its debugger open: explorer of lesson files, editor tabs, status bar
   PICTURE the step-through debugger itself: code with the running line lit, variable boxes, console
   COLOUR white editor / warm grey chrome; cobalt accent, IDE syntax colours; night: graphite #14161b
   TYPE IBM Plex Sans for UI and lessons, JetBrains Mono for code only
   LAYOUT laptop: explorer 270px left, editor area right, status bar; phone: top bar + drawer, one column */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#16181d);--chrome:light-dark(#f3f2ee,#0f1115);--panel:light-dark(#f8f8f6,#1c1f26);--ink:light-dark(#17191e,#e7e9ee);--muted:light-dark(#5b616c,#9aa1ad);--line:light-dark(#e1e0da,#2a2e37);
--accent:light-dark(#2346e8,#8098ff);--accent-ink:light-dark(#ffffff,#0f1115);--accent-soft:light-dark(#e9edff,#232a48);
--ok:light-dark(#0b7a3b,#56c98a);--ok-soft:light-dark(#e3f5ea,#183326);--bad:light-dark(#c4251b,#ff7a6e);--bad-soft:light-dark(#fdeceb,#3a1d1c);
--kw:light-dark(#0033b3,#cf8e6d);--str:light-dark(#067d17,#6aab73);--num:light-dark(#1750eb,#2aacb8);--com:light-dark(#8c8c8c,#7a7e85);--fn:light-dark(#00627a,#56a8f5);--ty:light-dark(#871094,#c77dbb);
--cur:light-dark(#fff3bf,#3b3417);--curmark:light-dark(#e8a400,#f2c14e);--chg:light-dark(#fff0a8,#4d4318);
--mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);overflow:hidden}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:.9em}
p code,li code,.note code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:0 4px;overflow-wrap:anywhere}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);grid-template-rows:44px minmax(0,1fr) 28px;height:100%}
.side{grid-row:1/3;background:var(--chrome);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden}
.brand{height:44px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--line);font-weight:700;letter-spacing:-.01em}
.brand svg{flex:none}
.tree{overflow-y:auto;padding:8px 0 24px;flex:1}
.tree h4{margin:14px 16px 4px;font-size:13px;font-weight:600;color:var(--muted)}
.tree a{display:flex;align-items:center;gap:8px;min-height:34px;padding:4px 14px 4px 16px;color:var(--ink);text-decoration:none;font-size:14px;border-left:3px solid transparent}
.tree a:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.tree a.on{background:var(--accent-soft);border-left-color:var(--accent);font-weight:600}
.tree a.file{padding-left:34px;font-family:var(--mono);font-size:13px}
.tree a .num{color:var(--muted);font-size:12px;margin-left:auto;font-family:var(--mono)}
.tree .folder{display:flex;align-items:center;gap:8px;padding:6px 16px;font-size:14px;font-weight:600}
.ring{flex:none}
.badge{margin-left:auto;background:var(--bad);color:#fff;border-radius:10px;font-size:12px;padding:0 7px;font-weight:600}
.top{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--chrome)}
.menu{display:none;border:0;background:none;width:48px;cursor:pointer}
.tab{display:flex;align-items:center;gap:8px;padding:0 18px;background:var(--bg);border-right:1px solid var(--line);font-family:var(--mono);font-size:13px;position:relative}
.tab::after{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:var(--accent)}
.top .sp{flex:1}
.main{overflow-y:auto;overflow-x:hidden}
.wrap{max-width:1120px;padding:28px max(4vw,16px) 64px}
.status{grid-column:1/3;display:flex;align-items:center;gap:18px;padding:0 14px;background:var(--accent);color:var(--accent-ink);font-size:12.5px;white-space:nowrap;overflow:hidden}
.status span{flex:none}.status .sp{flex:1}
h1{font-size:clamp(30px,4vw,42px);line-height:1.05;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
h2{font-size:22px;line-height:1.2;margin:0 0 10px;letter-spacing:-.01em}
h3{font-size:18px;margin:0 0 6px}
.lede{color:var(--muted);margin:0 0 22px;max-width:62ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-weight:600;font-size:15px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.opt:focus-visible,.tree a:focus-visible,.ln:focus-visible,.chip:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
/* code + debugger */
.code{font-family:var(--mono);font-size:14px;line-height:1.6;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:auto;padding:8px 0}
.ln{display:grid;grid-template-columns:44px minmax(max-content,1fr);white-space:pre;border:0;background:none;width:100%;text-align:left;padding:0;font:inherit;cursor:default}
.ln .g{color:var(--muted);text-align:right;padding-right:14px;user-select:none;font-size:12.5px;position:relative}
.ln .t{padding-right:16px}
.ln.cur{background:var(--cur)}
.ln.cur .g::before{content:"";position:absolute;left:6px;top:50%;margin-top:-5px;border:5px solid transparent;border-left:7px solid var(--curmark)}
.ln.errl{background:var(--bad-soft)}
.ln.pick{cursor:pointer}
.ln.pick:hover{background:var(--accent-soft)}
.ln.right{background:var(--ok-soft)}
.ln.wrong{background:var(--bad-soft)}
.k{color:var(--kw);font-weight:500}.s{color:var(--str)}.n{color:var(--num)}.c{color:var(--com);font-style:italic}.f{color:var(--fn)}.ty{color:var(--ty)}
.blank{background:var(--accent-soft);border:1.5px dashed var(--accent);border-radius:4px;padding:0 10px;color:var(--accent);font-weight:700}
.dbg{border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden;margin-top:12px}
.dbg-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--chrome)}
.ib{width:44px;height:40px;border-radius:7px;border:1px solid var(--line);background:var(--bg);cursor:pointer;display:grid;place-items:center}
.ib:hover{border-color:var(--accent)}
.ib.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);width:auto;padding:0 14px;gap:6px;display:flex;font-weight:600;font-size:14px}
.ib:disabled{opacity:.4;cursor:default}
.stepn{font-size:13px;color:var(--muted);font-family:var(--mono);margin-left:6px;white-space:nowrap}
.dbg input[type=range]{flex:1 1 120px;accent-color:var(--accent);min-height:30px}
.dbg-body{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
.dbg-body>div:first-child{display:flex;flex-direction:column}.dbg-body .code{border:0;border-radius:0;border-right:1px solid var(--line);max-height:460px;flex:1}
.dbg-side{display:flex;flex-direction:column}
.note{padding:12px 14px;border-bottom:1px solid var(--line);font-size:14.5px;min-height:64px;background:var(--bg)}
.note b{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-bottom:2px}
.note.err{background:var(--bad-soft);color:var(--bad)}
.vars{padding:10px 14px;border-bottom:1px solid var(--line);flex:1}
.vars h5,.con h5{margin:0 0 6px;font-size:12.5px;color:var(--muted);font-weight:600}
.frame{margin-bottom:10px}
.frame .fn{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-bottom:4px}
.frame.live .fn{color:var(--accent);font-weight:700}
.box{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;font-family:var(--mono);font-size:13.5px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;margin-bottom:4px;background:var(--bg)}
.box .vt{color:var(--ty);font-size:12px}
.box .vv{text-align:right;font-weight:700;overflow-wrap:anywhere}
.box.chg{background:var(--chg);transition:background .4s}
.empty{color:var(--muted);font-size:13px}
.con{padding:10px 14px}
.con pre{margin:0;font-family:var(--mono);font-size:13.5px;background:#111317;color:#e8e8e8;border-radius:6px;padding:10px 12px;min-height:44px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:200px;overflow:auto}
.con pre .er{color:#ff8a80}
/* lessons */
.card{border-top:1px solid var(--line);padding:26px 0}
.card p{max-width:70ch;margin:0 0 12px}
.trap{border:1px solid color-mix(in srgb,var(--curmark) 60%,var(--line));background:color-mix(in srgb,var(--cur) 55%,var(--bg));border-radius:8px;padding:10px 14px;margin:0 0 12px;max-width:70ch;font-size:15px}
.trap b{margin-right:6px}
.codehead{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}
.src{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin-bottom:16px}
/* home */
.home{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start}
.prog{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.prog h3{padding:12px 14px;margin:0;font-size:15px;background:var(--chrome);border-bottom:1px solid var(--line)}
.pr{display:grid;grid-template-columns:3.2em minmax(0,1fr) 72px;gap:10px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink);font-size:14px;min-height:44px}
.pr:hover{background:var(--accent-soft)}
.pr .id{font-family:var(--mono);color:var(--muted);font-size:13px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:4px}
.next{border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px;background:var(--panel)}
.next p{margin:0 0 12px;color:var(--muted);font-size:15px}
/* practice */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{min-height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:14px;font-weight:500}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.kind{font-weight:700;color:var(--accent);font-size:14px}
.dots{display:flex;gap:4px;margin-left:auto}
.dots i{width:18px;height:6px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.bad{background:var(--bad)}.dots i.now{background:var(--accent)}
.prompt{font-size:20px;font-weight:600;margin:0 0 12px;line-height:1.3}
.task{margin:0 0 12px;max-width:70ch}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:16px}
.opt{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:9px;padding:12px;cursor:pointer;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .L{font-weight:700;color:var(--muted);font-family:var(--mono);font-size:13px;border:1px solid var(--line);border-radius:5px;text-align:center;line-height:22px}
.opt pre{margin:0;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.opt .crash{color:var(--bad);font-weight:700}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.fb{margin-top:16px;border-radius:10px;padding:14px 16px;border:1px solid var(--line)}
.fb.ok{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.fb.bad{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.fb h4{margin:0 0 4px;font-size:16px}
.fb p{margin:0 0 10px;max-width:70ch}
.score{font-size:clamp(48px,8vw,72px);font-weight:700;line-height:1;letter-spacing:-.03em}
.miss{border-top:1px solid var(--line);padding:12px 0}
textarea.ed{width:100%;min-height:300px;font-family:var(--mono);font-size:16px;line-height:1.55;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);tab-size:4;resize:vertical}
select{font:inherit;font-size:16px;min-height:44px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 10px}
.scrim{display:none}
.snd{border:0;background:none;width:48px;cursor:pointer;color:var(--muted);display:grid;place-items:center}
.snd:hover{color:var(--ink)}
.snd:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:-3px}
.snd .mute{display:none}.snd.off .wave{display:none}.snd.off .mute{display:inline}
.exs{display:grid;gap:6px;margin-bottom:6px}
.exr{display:grid;grid-template-columns:minmax(0,auto) auto minmax(0,1fr);gap:12px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--panel)}
.exr span{color:var(--muted);font-size:14px}
.exr pre,.tr pre,pre.ex{margin:0;font-family:var(--mono);font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
pre.ex{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-top:8px}
.tests{display:grid;gap:8px;margin-top:10px}
.tr{display:grid;grid-template-columns:44px minmax(0,1.2fr) minmax(0,1fr) minmax(0,1fr) auto;gap:12px;align-items:start;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.tr .tm{font-weight:700;font-size:13px}
.tr.tp .tm{color:var(--ok)}.tr.tf .tm{color:var(--bad)}
.tr.tf{border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.tl{display:block;font-size:12px;color:var(--muted)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px}
.st{font-size:13px;font-weight:600;text-align:right}
.st-solved{color:var(--ok)}.st-tried{color:var(--curmark)}.st-new{color:var(--muted)}
.pr.wr{grid-template-columns:4.2em minmax(0,1fr) 72px}
.fb.claude{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.fb.claude .ct{white-space:pre-wrap;margin:0}
details summary{cursor:pointer;font-weight:600;min-height:32px}
@media(max-width:900px){.home{grid-template-columns:minmax(0,1fr)}.dbg-body{grid-template-columns:minmax(0,1fr)}.dbg-body .code{border-right:0;border-bottom:1px solid var(--line);max-height:340px}}
@media(max-width:760px){
.tr{grid-template-columns:44px minmax(0,1fr)}.tr>div,.tr>button{grid-column:2}.exr{grid-template-columns:minmax(0,1fr)}
.app{grid-template-columns:minmax(0,1fr)}
.side{position:fixed;z-index:20;top:0;bottom:0;left:0;width:min(300px,86vw);transform:translateX(-100%);transition:transform .2s}
.app.open .side{transform:none}
.app.open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:15}
.menu{display:grid;place-items:center}
.status{grid-column:1}
.opts{grid-template-columns:minmax(0,1fr)}
.wrap{padding-top:20px}
.status .hide-s{display:none}
}
@media(prefers-reduced-motion:reduce){.side{transition:none}.box.chg{transition:none}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><rect x="1" y="1" width="20" height="20" rx="5" fill="var(--accent)"/><path d="M8 6 L4.5 11 L8 16 M14 6 L17.5 11 L14 16" stroke="var(--accent-ink)" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
      CSA Lab
    </div>
    <nav class="tree" id="tree"></nav>
  </aside>
  <div class="scrim" id="scrim"></div>
  <header class="top">
    <button class="menu" id="menu" aria-label="Open menu"><svg width="20" height="20" viewBox="0 0 20 20"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    <div class="tab" id="tab">Home.java</div>
    <div class="sp"></div>
    <button class="snd" id="snd" aria-label="Sound on" title="Mute sounds"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/><path class="mute" d="M17 9l5 6M22 9l-5 6"/></svg></button>
  </header>
  <main class="main" id="main"><div class="wrap" id="view"></div></main>
  <footer class="status" id="status"></footer>
</div>
<script>
// Mini Java interpreter for AP CSA Units 1-2: primitives, Strings, Math, if/loops, static methods.
// Produces a step-by-step trace for the debugger view.
const JavaEngine = (() => {
  class JErr extends Error { constructor(kind, msg, line) { super(msg); this.kind = kind; this.line = line; } }
  const compile = (msg, line) => new JErr('compile', msg, line);
  const thrown = (name, msg, line) => new JErr(name, msg, line);

  const OPS = ['++', '--', '+=', '-=', '*=', '/=', '%=', '==', '!=', '<=', '>=', '&&', '||', '+', '-', '*', '/', '%', '<', '>', '=', '!', '(', ')', '{', '}', '[', ']', ';', ',', '.', '?', ':'];
  const TYPES = new Set(['int', 'double', 'boolean', 'String']);

  function lex(src) {
    const toks = []; let i = 0, line = 1; const n = src.length;
    while (i < n) {
      const c = src[i];
      if (c === '\n') { line++; i++; continue; }
      if (/\s/.test(c)) { i++; continue; }
      if (c === '/' && src[i + 1] === '/') { while (i < n && src[i] !== '\n') i++; continue; }
      if (c === '/' && src[i + 1] === '*') { i += 2; while (i < n && !(src[i] === '*' && src[i + 1] === '/')) { if (src[i] === '\n') line++; i++; } i += 2; continue; }
      if (/[0-9]/.test(c) || (c === '.' && /[0-9]/.test(src[i + 1] || ''))) {
        let j = i, isD = false;
        while (j < n && /[0-9]/.test(src[j])) j++;
        if (src[j] === '.' && /[0-9]/.test(src[j + 1] || '')) { isD = true; j++; while (j < n && /[0-9]/.test(src[j])) j++; }
        else if (src[j] === '.' && !/[A-Za-z_]/.test(src[j + 1] || '')) { isD = true; j++; }
        if (src[j] === 'e' || src[j] === 'E') { isD = true; j++; if (src[j] === '+' || src[j] === '-') j++; while (j < n && /[0-9]/.test(src[j])) j++; }
        const txt = src.slice(i, j);
        if (src[j] === 'd' || src[j] === 'D') { isD = true; j++; }
        toks.push({ k: isD ? 'dbl' : 'int', v: txt, line, s: i, e: j }); i = j; continue;
      }
      if (c === '"') {
        let j = i + 1, s = '';
        while (j < n && src[j] !== '"') {
          if (src[j] === '\n') throw compile('unclosed string literal', line);
          if (src[j] === '\\') {
            const e = src[j + 1];
            const map = { n: '\n', t: '\t', '"': '"', '\\': '\\', "'": "'" };
            if (!(e in map)) throw compile('illegal escape character in string: \\' + e, line);
            s += map[e]; j += 2; continue;
          }
          s += src[j]; j++;
        }
        if (j >= n) throw compile('unclosed string literal', line);

<script>
const DATA = {"problems":[{"id":"average3","topic":"1.3","title":"Average of three","kind":"return","prompt":"Return the average of the three ints as a double, with the decimal kept. <code>average(1, 2, 2)<\/code> should be 1.666..., not 1.","sig":"public static double average(int a, int b, int c)","tests":["average(1, 2, 3)","average(1, 2, 2)","average(0, 0, 1)","average(-3, 3, 1)","average(10, 10, 10)"],"expect":["2.0","1.6666666666666667","0.3333333333333333","0.3333333333333333","10.0"],"hints":["If every value in the division is an int, Java chops the decimal before you ever store it.","Divide by 3.0 instead of 3, and keep the sum in parentheses."],"solution":"public static double average(int a, int b, int c) {\n    return (a + b + c) / 3.0;\n}","explain":"(a + b + c) adds first because of the parentheses. Dividing by 3.0 makes it double division, so the decimal survives."},{"id":"formatTime","topic":"1.3","title":"Minutes to hours","kind":"return","prompt":"Given a number of minutes, return a String like <code>\"2 hr 15 min\"<\/code>. <code>formatTime(135)<\/code> returns <code>\"2 hr 15 min\"<\/code> and <code>formatTime(45)<\/code> returns <code>\"0 hr 45 min\"<\/code>.","sig":"public static String formatTime(int minutes)","tests":["formatTime(135)","formatTime(45)","formatTime(60)","formatTime(0)","formatTime(1000)"],"expect":["2 hr 15 min","0 hr 45 min","1 hr 0 min","0 hr 0 min","16 hr 40 min"],"hints":["Integer division by 60 gives the whole hours.","The remainder (% 60) gives the leftover minutes."],"solution":"public static String formatTime(int minutes) {\n    int hours = minutes / 60;\n    int mins = minutes % 60;\n    return hours + \" hr \" + mins + \" min\";\n}","explain":"/ 60 with ints gives whole hours and % 60 gives what is left over. This divide-and-remainder pair shows up all over the AP exam (also for digits, cents, seconds)."},{"id":"roundHalfUp","topic":"1.5","title":"Round to the nearest int","kind":"return","prompt":"Return <code>x<\/code> rounded to the nearest int, rounding .5 up. You can assume <code>x<\/code> is not negative. Use a cast, not Math.round.","sig":"public static int roundHalfUp(double x)","tests":["roundHalfUp(3.8)","roundHalfUp(3.2)","roundHalfUp(3.5)","roundHalfUp(0.49)","roundHalfUp(10.0)"],"expect":["4","3","4","0","10"],"hints":["(int) chops the decimal off. It never rounds.","Add 0.5 first, then cast the whole thing: (int) (x + 0.5)."],"solution":"public static int roundHalfUp(double x) {\n    return (int) (x + 0.5);\n}","explain":"Adding 0.5 pushes anything at .5 or above past the next whole number, and the cast then chops the decimal."},{"id":"totalSeconds","topic":"1.9","title":"Total seconds","kind":"return","prompt":"Return how many seconds are in <code>h<\/code> hours, <code>m<\/code> minutes and <code>s<\/code> seconds. <code>totalSeconds(1, 2, 3)<\/code> is 3723.","sig":"public static int totalSeconds(int h, int m, int s)","tests":["totalSeconds(1, 2, 3)","totalSeconds(0, 0, 0)","totalSeconds(0, 5, 0)","totalSeconds(2, 0, 30)"],"expect":["3723","0","300","7230"],"hints":["One hour is 3600 seconds and one minute is 60."],"solution":"public static int totalSeconds(int h, int m, int s) {\n    return h * 3600 + m * 60 + s;\n}","explain":"Convert each part to seconds and add. * happens before +, so no parentheses are needed."},{"id":"hypotenuse","topic":"1.11","title":"Hypotenuse","kind":"return","prompt":"Return the length of the hypotenuse of a right triangle with legs <code>a<\/code> and <code>b<\/code> (the square root of a² + b²).","sig":"public static double hypotenuse(double a, double b)","tests":["hypotenuse(3, 4)","hypotenuse(5, 12)","hypotenuse(1, 1)","hypotenuse(0, 7)"],"expect":["5.0","13.0","1.4142135623730951","7.0"],"hints":["Math.sqrt(x) is the square root. Math.pow(a, 2) or a * a squares a."],"solution":"public static double hypotenuse(double a, double b) {\n    return Math.sqrt(a * a + b * b);\n}","explain":"Square each leg, add, then take the square root. The inner part runs first, then Math.sqrt."},{"id":"initials","topic":"1.15","title":"Initials","kind":"return","prompt":"Return the first letter of <code>first<\/code> followed by the first letter of <code>last<\/code>. <code>initials(\"Dylan\", \"Harris\")<\/code> returns <code>\"DH\"<\/code>.","sig":"public static String initials(String first, String last)","tests":["initials(\"Dylan\", \"Harris\")","initials(\"ada\", \"lovelace\")","initials(\"X\", \"Y\")"],"expect":["DH","al","XY"],"hints":["substring(0, 1) gives the first letter of a String."],"solution":"public static String initials(String first, String last) {\n    return first.substring(0, 1) + last.substring(0, 1);\n}","explain":"substring(0, 1) takes index 0 and stops before index 1, so it is exactly one letter."},{"id":"firstAndLast","topic":"1.15","title":"First and last letter","kind":"return","prompt":"Return a String made of the first and last letter of <code>s<\/code>. <code>s<\/code> has at least one letter. <code>firstAndLast(\"java\")<\/code> returns <code>\"ja\"<\/code> and <code>firstAndLast(\"a\")<\/code> returns <code>\"aa\"<\/code>.","sig":"public static String firstAndLast(String s)","tests":["firstAndLast(\"java\")","firstAndLast(\"hello\")","firstAndLast(\"a\")","firstAndLast(\"ok\")"],"expect":["ja","ho","aa","ok"],"hints":["The last index is s.length() - 1.","s.substring(s.length() - 1) is the last letter."],"solution":"public static String firstAndLast(String s) {\n    return s.substring(0, 1) + s.substring(s.length() - 1);\n}","explain":"Indexes run 0 to length() - 1. substring(length() - 1) starts at the last index and goes to the end, which is one letter."},{"id":"removeFirst","topic":"1.15","title":"Remove the first match","kind":"return","prompt":"Return <code>s<\/code> with the first occurrence of <code>part<\/code> removed. If <code>part<\/code> is not in <code>s<\/code>, return <code>s<\/code> unchanged. <code>removeFirst(\"banana\", \"an\")<\/code> returns <code>\"bana\"<\/code>.","sig":"public static String removeFirst(String s, String part)","tests":["removeFirst(\"banana\", \"an\")","removeFirst(\"hello\", \"x\")","removeFirst(\"aaa\", \"a\")","removeFirst(\"abc\", \"abc\")","removeFirst(\"racecar\", \"car\")"],"expect":["bana","hello","aa","","race"],"hints":["indexOf tells you where part starts, or -1 if it is not there.","Keep everything before that index, then everything starting at index + part.length()."],"solution":"public static String removeFirst(String s, String part) {\n    int i = s.indexOf(part);\n    if (i == -1) {\n        return s;\n    }\n    return s.substring(0, i) + s.substring(i + part.length());\n}","explain":"Check for -1 first, or substring(0, -1) crashes. Then glue the part before the match to the part after it. The \"after\" part starts at i + part.length() because part may be more than one letter."},{"id":"letterGrade","topic":"2.3","title":"Letter grade","kind":"return","prompt":"Return <code>\"A\"<\/code> for 90 and up, <code>\"B\"<\/code> for 80 to 89, <code>\"C\"<\/code> for 70 to 79, <code>\"D\"<\/code> for 60 to 69, and <code>\"F\"<\/code> below 60.","sig":"public static String letterGrade(int score)","tests":["letterGrade(95)","letterGrade(90)","letterGrade(89)","letterGrade(70)","letterGrade(60)","letterGrade(59)","letterGrade(0)"],"expect":["A","A","B","C","D","F","F"],"hints":["Use an if / else if chain. Only the first true branch runs.","Check from the top (>= 90) down, using >= so the boundaries are included."],"solution":"public static String letterGrade(int score) {\n    if (score >= 90) {\n        return \"A\";\n    } else if (score >= 80) {\n        return \"B\";\n    } else if (score >= 70) {\n        return \"C\";\n    } else if (score >= 60) {\n        return \"D\";\n    }\n    return \"F\";\n}","explain":"Going from highest to lowest means each else if only sees scores that already failed the checks above it. Using >= includes the exact boundary (90 is an A)."},{"id":"maxOfThree","topic":"2.4","title":"Biggest of three","kind":"return","prompt":"Return the largest of <code>a<\/code>, <code>b<\/code> and <code>c<\/code>. Use if statements, not Math.max.","sig":"public static int maxOfThree(int a, int b, int c)","tests":["maxOfThree(1, 2, 3)","maxOfThree(3, 2, 1)","maxOfThree(2, 3, 1)","maxOfThree(3, 1, 5)","maxOfThree(5, 5, 1)","maxOfThree(-1, -2, -3)"],"expect":["3","3","3","5","5","-1"],"hints":["Keep a variable for the biggest so far. Start it at a.","Compare b to it, then c to it, replacing it when you find something bigger."],"solution":"public static int maxOfThree(int a, int b, int c) {\n    int max = a;\n    if (b > max) {\n        max = b;\n    }\n    if (c > max) {\n        max = c;\n    }\n    return max;\n}","explain":"The \"best so far\" pattern: start with the first value and replace it whenever you see a bigger one. Starting at 0 breaks when every value is negative."},{"id":"isTeen","topic":"2.5","title":"Is a teenager","kind":"return","prompt":"Return <code>true<\/code> if <code>age<\/code> is from 13 to 19, including 13 and 19.","sig":"public static boolean isTeen(int age)","tests":["isTeen(12)","isTeen(13)","isTeen(16)","isTeen(19)","isTeen(20)"],"expect":["false","true","true","true","false"],"hints":["Inside a range needs two comparisons joined with &&."],"solution":"public static boolean isTeen(int age) {\n    return age >= 13 && age <= 19;\n}","explain":"You can return a boolean expression directly. No if needed. >= and <= include the ends."},{"id":"isLeapYear","topic":"2.5","title":"Leap year","kind":"return","prompt":"A year is a leap year if it is divisible by 4, except years divisible by 100 are not, unless they are also divisible by 400. So 2024 and 2000 are leap years, but 1900 is not.","sig":"public static boolean isLeapYear(int year)","tests":["isLeapYear(2024)","isLeapYear(2023)","isLeapYear(1900)","isLeapYear(2000)","isLeapYear(2100)"],"expect":["true","false","false","true","false"],"hints":["Divisible by 4 means year % 4 == 0.","Leap if: (divisible by 4 AND not divisible by 100) OR divisible by 400."],"solution":"public static boolean isLeapYear(int year) {\n    return (year % 4 == 0 && year % 100 != 0) || year % 400 == 0;\n}","explain":"Each rule becomes one comparison, then && and || combine them. The test cases 1900 and 2000 are there to catch the two exceptions."},{"id":"digitSum","topic":"2.7","title":"Digit sum","kind":"return","prompt":"Return the sum of the digits of <code>n<\/code> (n is 0 or more). <code>digitSum(4721)<\/code> is 4 + 7 + 2 + 1 = 14.","sig":"public static int digitSum(int n)","tests":["digitSum(4721)","digitSum(0)","digitSum(9)","digitSum(1000)","digitSum(99999)"],"expect":["14","0","9","1","45"],"hints":["n % 10 is the last digit.","n / 10 drops the last digit. Loop while n > 0."],"solution":"public static int digitSum(int n) {\n    int sum = 0;\n    while (n > 0) {\n        sum += n % 10;\n        n /= 10;\n    }\n    return sum;\n}","explain":"Each pass peels off one digit: add the last digit with % 10, then remove it with / 10. When n hits 0, every digit has been added."},{"id":"countDigits","topic":"2.7","title":"Count digits","kind":"return","prompt":"Return how many digits <code>n<\/code> has (n is 0 or more). Careful: 0 has one digit.","sig":"public static int countDigits(int n)","tests":["countDigits(7)","countDigits(10)","countDigits(12345)","countDigits(0)"],"expect":["1","2","5","1"],"hints":["Divide by 10 until nothing is left and count the passes.","A plain while (n > 0) loop runs zero times for 0. Handle 0 separately."],"solution":"public static int countDigits(int n) {\n    if (n == 0) {\n        return 1;\n    }\n    int count = 0;\n    while (n > 0) {\n        n /= 10;\n        count++;\n    }\n    return count;\n}","explain":"The loop counts how many times you can drop a digit. Zero is the edge case: the loop never runs, so you need the special case. Edge cases like this are exactly what AP scorers check."},{"id":"reverseNumber","topic":"2.7","title":"Reverse a number","kind":"return","prompt":"Return the digits of <code>n<\/code> in reverse order. <code>reverseNumber(1234)<\/code> is 4321 and <code>reverseNumber(1200)<\/code> is 21.","sig":"public static int reverseNumber(int n)","tests":["reverseNumber(1234)","reverseNumber(1200)","reverseNumber(5)","reverseNumber(0)"],"expect":["4321","21","5","0"],"hints":["Build the answer one digit at a time, starting from 0.","Each pass: rev = rev * 10 + n % 10, then n /= 10."],"solution":"public static int reverseNumber(int n) {\n    int rev = 0;\n    while (n > 0) {\n        rev = rev * 10 + n % 10;\n        n /= 10;\n    }\n    return rev;\n}","explain":"Multiplying rev by 10 shifts its digits left to make room, then the last digit of n drops into the ones place."},{"id":"collatz","topic":"2.7","title":"Collatz steps","kind":"return","prompt":"Start at <code>n<\/code> (1 or more). If it is even, halve it. If it is odd, make it 3n + 1. Return how many steps it takes to reach 1. <code>collatzSteps(1)<\/code> is 0 and <code>collatzSteps(6)<\/code> is 8.","sig":"public static int collatzSteps(int n)","tests":["collatzSteps(1)","collatzSteps(2)","collatzSteps(3)","collatzSteps(6)","collatzSteps(27)"],"expect":["0","1","7","8","111"],"hints":["You do not know how many steps ahead of time, so use a while loop: while (n != 1).","Inside, use if / else on n % 2 == 0, and count each step."],"solution":"public static int collatzSteps(int n) {\n    int steps = 0;\n    while (n != 1) {\n        if (n % 2 == 0) {\n            n = n / 2;\n        } else {\n            n = 3 * n + 1;\n        }\n        steps++;\n    }\n    return steps;\n}","explain":"A while loop fits because the number of steps is unknown. The if / else makes sure exactly one rule applies each step."},{"id":"sumRange","topic":"2.8","title":"Sum a range","kind":"return","prompt":"Return the sum of every int from <code>a<\/code> to <code>b<\/code>, including both. You can assume a ≤ b. <code>sumRange(1, 5)<\/code> is 15.","sig":"public static int sumRange(int a, int b)","tests":["sumRange(1, 5)","sumRange(3, 3)","sumRange(-2, 2)","sumRange(10, 12)"],"expect":["15","3","0","33"],"hints":["Accumulator: start a sum at 0 and add inside a for loop.","Loop from a while i <= b so b is included."],"solution":"public static int sumRange(int a, int b) {\n    int sum = 0;\n    for (int i = a; i <= b; i++) {\n        sum += i;\n    }\n    return sum;\n}","explain":"Accumulator pattern: declare the total outside the loop, add to it inside, return it after. <= includes the last number."},{"id":"countdown","topic":"2.8","title":"Countdown","kind":"print","prompt":"Print the numbers from <code>n<\/code> down to 1 on one line, each followed by a space, then print <code>Liftoff!<\/code> and end the line. <code>countdown(3)<\/code> prints <code>3 2 1 Liftoff!<\/code>","sig":"public static void countdown(int n)","tests":["countdown(3)","countdown(1)","countdown(0)","countdown(5)"],"expect":["3 2 1 Liftoff!","1 Liftoff!","Liftoff!","5 4 3 2 1 Liftoff!"],"hints":["Count down: for (int i = n; i >= 1; i--).","Use print inside the loop and println(\"Liftoff!\") after it."],"solution":"public static void countdown(int n) {\n    for (int i = n; i >= 1; i--) {\n        System.out.print(i + \" \");\n    }\n    System.out.println(\"Liftoff!\");\n}","explain":"The loop counts down by changing the update to i--. print keeps everything on one line until the final println."},{"id":"isPrime","topic":"2.9","title":"Is prime","kind":"return","prompt":"Return <code>true<\/code> if <code>n<\/code> is prime: greater than 1 and divisible only by 1 and itself.","sig":"public static boolean isPrime(int n)","tests":["isPrime(2)","isPrime(13)","isPrime(29)","isPrime(9)","isPrime(49)","isPrime(1)","isPrime(0)"],"expect":["true","true","true","false","false","false","false"],"hints":["Numbers below 2 are never prime. Handle that first.","Try every d from 2 up to n - 1. If n % d == 0 for any of them, it is not prime."],"solution":"public static boolean isPrime(int n) {\n    if (n < 2) {\n        return false;\n    }\n    for (int d = 2; d < n; d++) {\n        if (n % d == 0) {\n            return false;\n        }\n    }\n    return true;\n}","explain":"Return false the moment you find a divisor. Only return true after the loop has checked every candidate. Returning true inside the loop (the else) would stop after checking just 2."},{"id":"gcd","topic":"2.9","title":"Greatest common divisor","kind":"return","prompt":"Return the largest number that divides both <code>a<\/code> and <code>b<\/code> evenly. Both are 1 or more. <code>gcd(12, 18)<\/code> is 6.","sig":"public static int gcd(int a, int b)","tests":["gcd(12, 18)","gcd(7, 3)","gcd(10, 5)","gcd(9, 9)","gcd(1, 100)"],"expect":["6","1","5","9","1"],"hints":["Try every d from 1 up to the smaller of a and b.","Whenever both a % d == 0 and b % d == 0, remember d. The last one you remember is the biggest."],"solution":"public static int gcd(int a, int b) {\n    int best = 1;\n    for (int d = 1; d <= a && d <= b; d++) {\n        if (a % d == 0 && b % d == 0) {\n            best = d;\n        }\n    }\n    return best;\n}","explain":"Counting up and saving each common divisor leaves the biggest one at the end. Returning early would give you the smallest (always 1)."},{"id":"countMultiples","topic":"2.9","title":"Count multiples","kind":"return","prompt":"Return how many numbers from 1 to <code>n<\/code> are divisible by <code>k<\/code>. <code>countMultiples(20, 3)<\/code> is 6 (3, 6, 9, 12, 15, 18).","sig":"public static int countMultiples(int n, int k)","tests":["countMultiples(20, 3)","countMultiples(10, 10)","countMultiples(5, 7)","countMultiples(100, 1)"],"expect":["6","1","0","100"],"hints":["Counter pattern: loop 1 to n, add 1 when i % k == 0."],"solution":"public static int countMultiples(int n, int k) {\n    int count = 0;\n    for (int i = 1; i <= n; i++) {\n        if (i % k == 0) {\n            count++;\n        }\n    }\n    return count;\n}","explain":"A loop over every candidate, an if to test it, and a counter. Using < n would miss n itself (countMultiples(10, 10) needs to count 10)."},{"id":"countLetter","topic":"2.10","title":"Count a letter","kind":"return","prompt":"Return how many times the one-letter String <code>letter<\/code> appears in <code>s<\/code>. <code>countLetter(\"mississippi\", \"s\")<\/code> is 4.","sig":"public static int countLetter(String s, String letter)","tests":["countLetter(\"mississippi\", \"s\")","countLetter(\"hello\", \"z\")","countLetter(\"\", \"a\")","countLetter(\"aaa\", \"a\")","countLetter(\"Banana\", \"b\")"],"expect":["4","0","0","3","0"],"hints":["Loop i from 0 while i < s.length().","Compare s.substring(i, i + 1) to letter with .equals, never ==."],"solution":"public static int countLetter(String s, String letter) {\n    int count = 0;\n    for (int i = 0; i < s.length(); i++) {\n        if (s.substring(i, i + 1).equals(letter)) {\n            count++;\n        }\n    }\n    return count;\n}","explain":"Traverse with substring(i, i + 1), compare with .equals. == compares objects, and substring makes new objects, so == fails even when the letters match. Note \"Banana\" has no lowercase b."},{"id":"reverse","topic":"2.10","title":"Reverse a String","kind":"return","prompt":"Return <code>s<\/code> backwards. <code>reverse(\"stop\")<\/code> returns <code>\"pots\"<\/code>.","sig":"public static String reverse(String s)","tests":["reverse(\"stop\")","reverse(\"a\")","reverse(\"\")","reverse(\"racecar\")","reverse(\"AP CSA\")"],"expect":["pots","a","","racecar","ASC PA"],"hints":["Start with an empty String \"\" and build the answer in a loop.","Put each letter in front of what you have: rev = letter + rev."],"solution":"public static String reverse(String s) {\n    String rev = \"\";\n    for (int i = 0; i < s.length(); i++) {\n        rev = s.substring(i, i + 1) + rev;\n    }\n    return rev;\n}","explain":"Adding each letter to the front reverses the order. You can also loop i from s.length() - 1 down to 0 and add to the end. Starting at s.length() crashes."},{"id":"isPalindrome","topic":"2.10","title":"Palindrome","kind":"return","prompt":"Return <code>true<\/code> if <code>s<\/code> reads the same forwards and backwards. The empty String counts as a palindrome.","sig":"public static boolean isPalindrome(String s)","tests":["isPalindrome(\"racecar\")","isPalindrome(\"abba\")","isPalindrome(\"abc\")","isPalindrome(\"ab\")","isPalindrome(\"\")","isPalindrome(\"x\")"],"expect":["true","true","false","false","true","true"],"hints":["Compare letter i with the letter at the mirror position, s.length() - 1 - i.","You only need to check the first half. Return false at the first mismatch."],"solution":"public static boolean isPalindrome(String s) {\n    int n = s.length();\n    for (int i = 0; i < n / 2; i++) {\n        String front = s.substring(i, i + 1);\n        String back = s.substring(n - 1 - i, n - i);\n        if (!front.equals(back)) {\n            return false;\n        }\n    }\n    return true;\n}","explain":"Check pairs from the outside in and bail out on the first mismatch. Returning true on the first match is a classic mistake: \"abca\" would pass."},{"id":"removeVowels","topic":"2.10","title":"Remove vowels","kind":"return","prompt":"Return <code>s<\/code> (all lowercase) with every vowel a, e, i, o, u removed. <code>removeVowels(\"education\")<\/code> returns <code>\"dctn\"<\/code>.","sig":"public static String removeVowels(String s)","tests":["removeVowels(\"education\")","removeVowels(\"rhythm\")","removeVowels(\"aeiou\")","removeVowels(\"banana\")"],"expect":["dctn","rhythm","","bnn"],"hints":["Build a new String and only add letters that are not vowels.","Trick: \"aeiou\".indexOf(letter) is -1 when letter is not a vowel."],"solution":"public static String removeVowels(String s) {\n    String result = \"\";\n    for (int i = 0; i < s.length(); i++) {\n        String ch = s.substring(i, i + 1);\n        if (\"aeiou\".indexOf(ch) == -1) {\n            result += ch;\n        }\n    }\n    return result;\n}","explain":"Strings cannot be changed, so you build a new one with only the letters you keep. indexOf returning -1 means \"not found in the vowel list\"."},{"id":"countWords","topic":"2.10","title":"Count words","kind":"return","prompt":"Words in <code>s<\/code> are separated by single spaces, with no spaces at the start or end. Return the number of words. The empty String has 0 words.","sig":"public static int countWords(String s)","tests":["countWords(\"hello world\")","countWords(\"one\")","countWords(\"\")","countWords(\"a b c d\")"],"expect":["2","1","0","4"],"hints":["Count the spaces. Words = spaces + 1.","Handle the empty String first, or it would say 1."],"solution":"public static int countWords(String s) {\n    if (s.length() == 0) {\n        return 0;\n    }\n    int spaces = 0;\n    for (int i = 0; i < s.length(); i++) {\n        if (s.substring(i, i + 1).equals(\" \")) {\n            spaces++;\n        }\n    }\n    return spaces + 1;\n}","explain":"With single spaces between words, there is always one more word than spaces. The empty String is the one exception, so it gets its own check."},{"id":"printTriangle","topic":"2.11","title":"Star triangle","kind":"print","prompt":"Print <code>n<\/code> rows of stars. Row 1 has 1 star, row 2 has 2, and so on. <code>printTriangle(3)<\/code> prints:<pre class=\"ex\">*\n**\n***<\/pre>","sig":"public static void printTriangle(int n)","tests":["printTriangle(3)","printTriangle(1)","printTriangle(0)","printTriangle(5)"],"expect":["*\n**\n***","*","","*\n**\n***\n****\n*****"],"hints":["Outer loop: one pass per row. Inner loop: one pass per star.","The inner loop runs row times. End each row with println()."],"solution":"public static void printTriangle(int n) {\n    for (int row = 1; row <= n; row++) {\n        for (int col = 1; col <= row; col++) {\n            System.out.print(\"*\");\n        }\n        System.out.println();\n    }\n}","explain":"The inner loop bound uses the outer variable (col <= row), which is what makes each row longer than the last."},{"id":"timesTable","topic":"2.11","title":"Times table","kind":"print","prompt":"Print an <code>n<\/code> by <code>n<\/code> times table. Row i has i×1, i×2, ..., i×n, each followed by a space. <code>timesTable(3)<\/code> prints:<pre class=\"ex\">1 2 3 \n2 4 6 \n3 6 9 <\/pre>","sig":"public static void timesTable(int n)","tests":["timesTable(3)","timesTable(1)","timesTable(4)"],"expect":["1 2 3\n2 4 6\n3 6 9","1","1 2 3 4\n2 4 6 8\n3 6 9 12\n4 8 12 16"],"hints":["Outer loop for rows i, inner loop for columns j, both from 1 to n.","Print i * j + \" \" inside, println() after the inner loop."],"solution":"public static void timesTable(int n) {\n    for (int i = 1; i <= n; i++) {\n        for (int j = 1; j <= n; j++) {\n            System.out.print(i * j + \" \");\n        }\n        System.out.println();\n    }\n}","explain":"Nested loops cover every (row, column) pair. Each row is finished by the println() that sits after the inner loop but inside the outer one."},{"id":"countPairs","topic":"2.11","title":"Even-sum pairs","kind":"return","prompt":"Count the pairs (i, j) with 1 ≤ i &lt; j ≤ n where i + j is even. For n = 4 the pairs are (1, 3) and (2, 4), so <code>countPairs(4)<\/code> is 2.","sig":"public static int countPairs(int n)","tests":["countPairs(4)","countPairs(5)","countPairs(1)","countPairs(2)","countPairs(10)"],"expect":["2","4","0","0","20"],"hints":["Outer loop i from 1 to n, inner loop j from i + 1 to n, so every pair is counted once with i < j.","Add 1 when (i + j) % 2 == 0."],"solution":"public static int countPairs(int n) {\n    int count = 0;\n    for (int i = 1; i <= n; i++) {\n        for (int j = i + 1; j <= n; j++) {\n            if ((i + j) % 2 == 0) {\n                count++;\n            }\n        }\n    }\n    return count;\n}","explain":"Starting j at i + 1 means each pair is counted once and never paired with itself. Starting j at 1 counts (1, 3) and (3, 1) separately, plus pairs like (2, 2)."}],"topics":[{"id":"1.3","unit":1,"title":"Expressions and output","file":"Output.java","cards":[{"h":"print vs println","p":"<code>println<\/code> prints, then moves to a new line. <code>print<\/code> stays on the same line, so the next thing printed lands right after it.","code":"System.out.print(\"A\");\nSystem.out.print(\"B\");\nSystem.out.println(\"C\");\nSystem.out.println(\"D\");"},{"h":"Integer division throws away the decimal","p":"When <b>both<\/b> sides are <code>int<\/code>, Java does integer division: it chops off the decimal (it does not round). <code>7 / 2<\/code> is <code>3<\/code>, and <code>2 / 3<\/code> is <code>0<\/code>. If either side is a <code>double<\/code>, you get the real answer.","code":"System.out.println(7 / 2);\nSystem.out.println(2 / 3);\nSystem.out.println(7 / 2.0);\nSystem.out.println(7.0 / 2);","trap":"This is the single most tested trap in Unit 1. Before you compute any division, check the types first."},{"h":"% is the remainder","p":"<code>a % b<\/code> gives the remainder after dividing. <code>17 % 5<\/code> is <code>2<\/code> because 17 = 3×5 + 2. Two patterns show up constantly: <code>n % 2 == 0<\/code> means n is even, and <code>n % 10<\/code> is the last digit of n.","code":"System.out.println(17 % 5);\nSystem.out.println(10 % 2);\nSystem.out.println(4 % 7);\nSystem.out.println(1234 % 10);"},{"h":"Order of operations, and + with Strings","p":"<code>*<\/code>, <code>/<\/code>, <code>%<\/code> happen before <code>+<\/code> and <code>-<\/code>. Ties go left to right. Once a String is on one side of <code>+<\/code>, it glues text instead of adding. Java goes left to right, so where the String sits changes everything.","code":"System.out.println(2 + 3 * 4);\nSystem.out.println(\"1\" + 2 + 3);\nSystem.out.println(1 + 2 + \"3\");\nSystem.out.println(\"Sum: \" + (1 + 2));"}]},{"id":"1.4","unit":1,"title":"Variables and assignment","file":"Variables.java","cards":[{"h":"A variable is a labeled box","p":"Declaring (<code>int x;<\/code>) makes the box. Assigning (<code>x = 5;<\/code>) puts a value in it. Doing both at once (<code>int x = 5;<\/code>) is initializing. The <code>=<\/code> sign means \"store\", not \"equals\".","code":"int x;\nx = 5;\nint y = x + 2;\nx = 10;\nSystem.out.println(x + \" \" + y);","trap":"Changing x later does NOT change y. y got a copy of the value at that moment."},{"h":"Right side first, then store","p":"Java computes the whole right side using the <b>current<\/b> values, then stores the result on the left. That is why <code>x = x + 1<\/code> makes sense: take the old x, add 1, store it back.","code":"int count = 3;\ncount = count + 1;\ncount = count * 2;\nSystem.out.println(count);"},{"h":"Swapping needs a third variable","p":"If you write <code>a = b; b = a;<\/code> you lose a's original value. Save it in a temp variable first. Trace this one step by step and watch the boxes.","code":"int a = 1;\nint b = 2;\nint temp = a;\na = b;\nb = temp;\nSystem.out.println(a + \" \" + b);"}]},{"id":"1.5","unit":1,"title":"Casting and ranges","file":"Casting.java","cards":[{"h":"Casting changes the type","p":"<code>(int)<\/code> turns a double into an int by <b>chopping off<\/b> the decimal, toward zero. <code>(int) 3.99<\/code> is 3 and <code>(int) -3.99<\/code> is -3. <code>(double)<\/code> turns an int into a double. Java does int → double on its own (widening), but never double → int without a cast.","code":"System.out.println((int) 3.99);\nSystem.out.println((int) -3.99);\nSystem.out.println((double) 5);\ndouble d = 10;\nSystem.out.println(d);"},{"h":"Where the cast goes matters","p":"A cast only applies to the thing right after it. <code>(double) 7 / 2<\/code> casts the 7 first, so it is 7.0 / 2 = 3.5. But <code>(double) (7 / 2)<\/code> does the integer division first (3) and then casts: 3.0.","code":"System.out.println((double) 7 / 2);\nSystem.out.println((double) (7 / 2));\nSystem.out.println(7 / 2 * 1.0);"},{"h":"Rounding with a cast","p":"From your notes: for a positive number, <code>(int) (x + 0.5)<\/code> rounds to the nearest int. For negatives, subtract 0.5 instead.","code":"double a = 3.8;\ndouble b = 3.2;\nSystem.out.println((int) (a + 0.5));\nSystem.out.println((int) (b + 0.5));\ndouble c = -3.8;\nSystem.out.println((int) (c - 0.5));"},{"h":"int has a max, and it wraps","p":"An int holds -2147483648 to 2147483647 (<code>Integer.MIN_VALUE<\/code> to <code>Integer.MAX_VALUE<\/code>). Going past the max does not crash. It wraps around to the minimum. That is overflow.","code":"int big = Integer.MAX_VALUE;\nSystem.out.println(big);\nSystem.out.println(big + 1);"}]},{"id":"1.6","unit":1,"title":"Compound assignment","file":"Compound.java","cards":[{"h":"Shortcuts","p":"<code>x += 3<\/code> means <code>x = x + 3<\/code>. Same idea for <code>-=<\/code>, <code>*=<\/code>, <code>/=<\/code>, <code>%=<\/code>. <code>x++<\/code> adds 1 and <code>x--<\/code> subtracts 1. On the AP exam, ++ and -- are used as their own statements, so you do not need the x++ vs ++x tricks.","code":"int x = 10;\nx += 5;\nx -= 3;\nx *= 2;\nx /= 5;\nx %= 3;\nx++;\nSystem.out.println(x);"},{"h":"Integer rules still apply","p":"<code>/=<\/code> on an int still does integer division. Run this and predict each line before stepping.","code":"int n = 17;\nn /= 2;\nSystem.out.println(n);\nn %= 3;\nSystem.out.println(n);"}]},{"id":"1.9","unit":1,"title":"Methods: headers, calls, return","file":"Methods.java","cards":[{"h":"Reading a method header","p":"<code>public static int square(int n)<\/code>: <code>int<\/code> is the return type (what comes back), <code>square<\/code> is the name, <code>int n<\/code> is the parameter. The <b>signature<\/b> is just the name plus parameter types: <code>square(int)<\/code>. The return type is not part of the signature.","code":"public class Main {\n    public static int square(int n) {\n        return n * n;\n    }\n\n    public static void main(String[] args) {\n        int a = square(3);\n        System.out.println(a);\n        System.out.println(square(a));\n    }\n}"},{"h":"void vs non-void","p":"A <code>void<\/code> method does something and gives nothing back, so you just call it on its own line. A non-void method hands back a value with <code>return<\/code>, and you should use that value (store it or print it). <code>return<\/code> ends the method immediately.","code":"public class Main {\n    public static void greet(String name) {\n        System.out.println(\"Hi \" + name);\n    }\n\n    public static int twice(int x) {\n        return x * 2;\n        // anything here would never run\n    }\n\n    public static void main(String[] args) {\n        greet(\"Dylan\");\n        twice(5);\n        System.out.println(twice(5));\n    }\n}","trap":"twice(5) on its own line runs, but the 10 it returns is thrown away. Nothing prints."},{"h":"Parameters get copies","p":"When you call a method, each argument's value is <b>copied<\/b> into the parameter. Changing the parameter inside the method does not change the caller's variable. Step through and watch two separate frames.","code":"public class Main {\n    public static void addTen(int n) {\n        n = n + 10;\n        System.out.println(\"inside: \" + n);\n    }\n\n    public static void main(String[] args) {\n        int score = 5;\n        addTen(score);\n        System.out.println(\"outside: \" + score);\n    }\n}"},{"h":"Overloading","p":"Two methods can share a name if their parameter lists differ. Java picks the one whose signature matches the arguments.","code":"public class Main {\n    public static int add(int a, int b) {\n        return a + b;\n    }\n\n    public static double add(double a, double b) {\n        return a + b;\n    }\n\n    public static void main(String[] args) {\n        System.out.println(add(2, 3));\n        System.out.println(add(2.0, 3));\n    }\n}"}]},{"id":"1.11","unit":1,"title":"The Math class","file":"MathClass.java","cards":[{"h":"The four you need","p":"<code>Math.abs(x)<\/code> absolute value (int in, int out; double in, double out). <code>Math.pow(a, b)<\/code> a to the b, <b>always a double<\/b>. <code>Math.sqrt(x)<\/code> square root, always a double. <code>Math.random()<\/code> a double from 0.0 up to but not including 1.0.","code":"System.out.println(Math.abs(-4));\nSystem.out.println(Math.abs(-3.5));\nSystem.out.println(Math.pow(2, 3));\nSystem.out.println(Math.sqrt(9));\nSystem.out.println(Math.sqrt(2));"},{"h":"Random ints in a range","p":"Stretch, cast, shift: <code>(int) (Math.random() * (max - min + 1)) + min<\/code>. For 1 to 6 that is <code>(int) (Math.random() * 6) + 1<\/code>. The parentheses around the multiply matter: <code>(int) Math.random() * 6<\/code> casts first and is always 0.","code":"int die = (int) (Math.random() * 6) + 1;\nSystem.out.println(\"You rolled \" + die);\nint broken = (int) Math.random() * 6;\nSystem.out.println(\"Broken version: \" + broken);"},{"h":"Nested calls run inside out","p":"The inner call runs first and its result becomes the argument for the outer call. Classic example: distance between two points.","code":"int x1 = 0, y1 = 0, x2 = 3, y2 = 4;\ndouble dist = Math.sqrt(Math.pow(x2 - x1, 2) + Math.pow(y2 - y1, 2));\nSystem.out.println(dist);"}]},{"id":"1.12","unit":1,"title":"Objects, references, and null","file":"Objects.java","cards":[{"h":"Class vs object","p":"A <b>class<\/b> is the blueprint (Turtle). An <b>object<\/b> is one actual thing built from it (yertle). <code>new<\/code> calls a <b>constructor<\/b>, which builds the object and sets its starting values. A class can have several constructors with different parameter lists (overloading).","code":"String a = new String(\"hi\");\nString b = \"hello\";\nSystem.out.println(a.length() + b.length());"},{"h":"Reference variables hold an address","p":"A primitive variable (<code>int x = 5<\/code>) holds the value itself. An object variable holds a <b>reference<\/b>: where the object lives in memory. <code>null<\/code> means it points at nothing. Calling a method on null crashes with a NullPointerException.","code":"String name = null;\nSystem.out.println(\"before\");\nSystem.out.println(name.length());\nSystem.out.println(\"after\");","trap":"\"after\" never prints. The crash stops the program on the line where it happens."},{"h":"Instance vs class (static) methods","p":"Instance methods are called on an object: <code>yertle.forward()<\/code>, <code>name.length()<\/code>. Class methods are static and called on the class name: <code>Math.sqrt(9)<\/code>. A getter like <code>getWidth()<\/code> is a non-void instance method that hands back a value.","code":"String word = \"turtle\";\nint n = word.length();\ndouble r = Math.sqrt(n * 6);\nSystem.out.println(n + \" \" + r);"}]},{"id":"1.15","unit":1,"title":"String methods","file":"Strings.java","cards":[{"h":"Indexes start at 0","p":"In <code>\"HELLO\"<\/code>, H is index 0 and O is index 4. <code>length()<\/code> is 5. The last index is always <code>length() - 1<\/code>.","code":"String s = \"HELLO\";\nSystem.out.println(s.length());\nSystem.out.println(s.substring(0, 1));\nSystem.out.println(s.substring(4, 5));"},{"h":"substring(a, b) stops BEFORE b","p":"<code>s.substring(1, 4)<\/code> gives indexes 1, 2, 3 (not 4). Length of the result is b - a. <code>s.substring(a)<\/code> goes from a to the end. Going past the end crashes with StringIndexOutOfBoundsException. <code>substring(i, i + 1)<\/code> grabs one letter: you will use that pattern constantly in Unit 2.","code":"String s = \"COMPUTER\";\nSystem.out.println(s.substring(1, 4));\nSystem.out.println(s.substring(5));\nSystem.out.println(s.substring(3, 3));\nSystem.out.println(s.substring(2, 3));"},{"h":"indexOf finds, -1 means not found","p":"<code>s.indexOf(\"x\")<\/code> returns the index of the first match, or <b>-1<\/b> if it is not there.","code":"String s = \"banana\";\nSystem.out.println(s.indexOf(\"a\"));\nSystem.out.println(s.indexOf(\"nan\"));\nSystem.out.println(s.indexOf(\"z\"));"},{"h":"equals, compareTo, and immutability","p":"Compare String contents with <code>.equals()<\/code>, never <code>==<\/code> (that compares addresses). <code>a.compareTo(b)<\/code> is negative if a comes first alphabetically, 0 if equal, positive if a comes after. Strings never change: <code>s.toUpperCase()<\/code> makes a <b>new<\/b> String; s stays the same unless you reassign it.","code":"String a = \"apple\";\nString b = \"banana\";\nSystem.out.println(a.compareTo(b) < 0);\nSystem.out.println(a.equals(\"apple\"));\nString s = \"hi\";\ns.toUpperCase();\nSystem.out.println(s);\ns = s.toUpperCase();\nSystem.out.println(s);"}]},{"id":"2.1","unit":2,"title":"Algorithms: the 3 building blocks","file":"Algorithms.java","cards":[{"h":"Sequencing, selection, repetition","p":"Every algorithm is built from three things. <b>Sequencing<\/b>: steps run in order. <b>Selection<\/b>: a true/false decision picks a path (if statements). <b>Repetition<\/b>: steps repeat until something changes (loops). Your notes' ATM example has all three.","code":"int balance = 100;\nint withdraw = 30;\nif (withdraw <= balance) {\n    balance -= withdraw;\n}\nint months = 0;\nwhile (balance < 200) {\n    balance += 50;\n    months++;\n}\nSystem.out.println(balance + \" after \" + months + \" months\");"},{"h":"Order matters","p":"The same steps in a different order can give a different result. Check permission before showing data, check the divisor before dividing.","code":"int x = 5;\nx = x * 2;\nx = x + 3;\nSystem.out.println(x);\nint y = 5;\ny = y + 3;\ny = y * 2;\nSystem.out.println(y);"}]},{"id":"2.2","unit":2,"title":"Boolean expressions","file":"Booleans.java","cards":[{"h":"Every comparison is true or false","p":"The operators <code>==  !=  &lt;  &gt;  &lt;=  &gt;=<\/code> produce a boolean. Math happens first, then the comparison. A <code>boolean<\/code> variable can store the result.","code":"int score = 60;\nboolean passed = score >= 60;\nSystem.out.println(passed);\nSystem.out.println(score > 60);\nSystem.out.println(score + 5 == 65);\nSystem.out.println(score != 60);"},{"h":"Boundary values","p":"The most common trace mistake: <code>&gt;<\/code> vs <code>&gt;=<\/code> when the value is exactly on the line. When a question gives you 60 and the condition says 60, slow down.","code":"int age = 13;\nSystem.out.println(age > 13);\nSystem.out.println(age >= 13);\nSystem.out.println(age < 13);"},{"h":"= stores, == compares","p":"<code>=<\/code> is assignment. <code>==<\/code> asks a question. <code>if (x = 5)<\/code> does not even compile in Java because x = 5 is an int, not a boolean.","code":"int x = 3;\nboolean same = x == 3;\nx = 4;\nSystem.out.println(same);\nSystem.out.println(x == 3);"},{"h":"== vs .equals for Strings","p":"This is the \"String pool?\" question from your notes. For objects, <code>==<\/code> asks \"are these the <b>same object<\/b> in memory?\" <code>.equals<\/code> asks \"do they have the <b>same text<\/b>?\" Java reuses one object for identical literals like <code>\"hi\"<\/code> (that is the String pool), so == can accidentally work, then fail when a String is built with <code>new<\/code> or by a method. Always use .equals for Strings.","code":"String a = \"hi\";\nString b = \"hi\";\nString c = new String(\"hi\");\nSystem.out.println(a == b);\nSystem.out.println(a == c);\nSystem.out.println(a.equals(c));","trap":"a == b is true only because both point at the same pooled \"hi\". a == c is false even though the text matches."}]},{"id":"2.3","unit":2,"title":"if statements","file":"IfStatements.java","cards":[{"h":"One-way: if","p":"If the condition is true, run the block. If false, skip it and continue after the closing brace.","code":"int temp = 85;\nif (temp > 80) {\n    System.out.println(\"Hot\");\n}\nSystem.out.println(\"Done\");"},{"h":"Two-way: if / else","p":"Exactly one of the two blocks runs. Never both, never neither.","code":"int n = 7;\nif (n % 2 == 0) {\n    System.out.println(\"even\");\n} else {\n    System.out.println(\"odd\");\n}"},{"h":"Multiway: else if chain","p":"Java checks top to bottom and runs only the <b>first<\/b> true branch, then skips the rest of the chain. Order your conditions from most specific to least.","code":"int score = 85;\nif (score >= 90) {\n    System.out.println(\"A\");\n} else if (score >= 80) {\n    System.out.println(\"B\");\n} else if (score >= 70) {\n    System.out.println(\"C\");\n} else {\n    System.out.println(\"F\");\n}","trap":"score >= 70 is also true, but it never gets checked. The chain stopped at B."},{"h":"Separate ifs are NOT a chain","p":"Three separate <code>if<\/code>s each get checked on their own, so several can run. Compare this to the chain above.","code":"int score = 85;\nif (score >= 90) {\n    System.out.println(\"A\");\n}\nif (score >= 80) {\n    System.out.println(\"B\");\n}\nif (score >= 70) {\n    System.out.println(\"C\");\n}"}]},{"id":"2.4","unit":2,"title":"Nested if statements","file":"NestedIf.java","cards":[{"h":"An if inside an if","p":"The inner if is only checked when the outer condition is true. Think of it as a gate, then another gate.","code":"int age = 16;\nboolean hasPermit = false;\nif (age >= 16) {\n    if (hasPermit) {\n        System.out.println(\"Can drive\");\n    } else {\n        System.out.println(\"Get a permit\");\n    }\n} else {\n    System.out.println(\"Too young\");\n}"},{"h":"else belongs to the closest if","p":"Without braces, an <code>else<\/code> attaches to the nearest unmatched <code>if<\/code>, no matter how it is indented. Indentation means nothing to Java.","code":"int x = 5;\nif (x > 10)\n    if (x > 20)\n        System.out.println(\"big\");\nelse\n    System.out.println(\"not big\");\nSystem.out.println(\"end\");","trap":"Looks like the else goes with x > 10, but it goes with x > 20. Since x > 10 is false, nothing inside runs."},{"h":"From your Battle Damage lab","p":"Nested ifs are how the lab worked: first check hit or miss, and only on a hit check the weapon and critical. Here is the same logic with a fixed roll so you can trace it.","code":"int roll = 19;\nint armorClass = 4;\nint level = 3;\nint weapon = 2;\nif (roll >= armorClass * 3) {\n    int damage = 10 + level;\n    if (weapon == 1) {\n        damage += 2;\n    } else if (weapon == 2) {\n        damage += 1;\n    } else {\n        damage += 3;\n    }\n    if (roll >= 18) {\n        damage *= 2;\n    }\n    damage -= armorClass;\n    System.out.println(\"Hit for \" + damage);\n} else {\n    System.out.println(\"MISS\");\n}"}]},{"id":"2.5","unit":2,"title":"Compound boolean expressions","file":"Compound.java","cards":[{"h":"&&, ||, !","p":"<code>a && b<\/code> is true only if both are true. <code>a || b<\/code> is true if at least one is true. <code>!a<\/code> flips it. Order: <code>!<\/code> first, then <code>&&<\/code>, then <code>||<\/code> (like × before +).","code":"int x = 7;\nSystem.out.println(x > 5 && x < 10);\nSystem.out.println(x < 5 || x == 7);\nSystem.out.println(!(x > 5));\nSystem.out.println(true || false && false);"},{"h":"Short-circuit evaluation","p":"Java stops as soon as it knows the answer. With <code>&&<\/code>, if the left side is false, the right side never runs. With <code>||<\/code>, if the left is true, the right never runs. This is how you avoid crashes, like dividing by zero.","code":"int count = 0;\nint total = 50;\nif (count != 0 && total / count > 10) {\n    System.out.println(\"big average\");\n} else {\n    System.out.println(\"safe\");\n}","trap":"Flip the two sides and this crashes with ArithmeticException, because total / count runs first."},{"h":"Ranges need two comparisons","p":"Math class lets you write 1 &lt; x &lt; 10. Java does not. Write <code>x &gt; 1 && x &lt; 10<\/code>. Outside a range uses <code>||<\/code>.","code":"int x = 12;\nboolean inside = x >= 1 && x <= 10;\nboolean outside = x < 1 || x > 10;\nSystem.out.println(inside + \" \" + outside);"}]},{"id":"2.6","unit":2,"title":"Comparing boolean expressions","file":"DeMorgan.java","cards":[{"h":"Equivalent means same result for EVERY input","p":"Two expressions are equivalent only if they match in every case. One mismatch and they are not. To check fast, test edge cases (the boundary value, and one on each side).","code":"int x = 5;\nSystem.out.println(!(x > 5));\nSystem.out.println(x <= 5);\nSystem.out.println(x < 5);"},{"h":"De Morgan's laws","p":"When you push a <code>!<\/code> inside parentheses, flip each piece and swap <code>&&<\/code> with <code>||<\/code>.<br><code>!(a && b)<\/code> is the same as <code>!a || !b<\/code><br><code>!(a || b)<\/code> is the same as <code>!a && !b<\/code><br>Flipping a comparison: <code>!(x &gt; 5)<\/code> becomes <code>x &lt;= 5<\/code> (not x &lt; 5).","code":"int x = 3;\nint y = 8;\nSystem.out.println(!(x > 5 && y > 5));\nSystem.out.println(x <= 5 || y <= 5);\nSystem.out.println(!(x > 5 || y > 5));\nSystem.out.println(x <= 5 && y <= 5);"}]},{"id":"2.7","unit":2,"title":"while loops","file":"WhileLoops.java","cards":[{"h":"The four parts of every loop","p":"1) <b>Initialize<\/b> a variable. 2) Check the <b>condition<\/b>. 3) Run the <b>body<\/b>. 4) <b>Update<\/b> so the loop can eventually stop. Then back to step 2. If the condition is false the very first time, the body runs zero times.","code":"int i = 1;\nwhile (i <= 3) {\n    System.out.println(\"pass \" + i);\n    i++;\n}\nSystem.out.println(\"i ended at \" + i);","trap":"After the loop, i is 4, not 3. The loop stops because i became 4 and the condition failed."},{"h":"Forget the update = infinite loop","p":"If nothing in the body moves the variable toward making the condition false, the loop never ends. Step through this and the debugger will stop it for you.","code":"int n = 5;\nwhile (n > 0) {\n    System.out.println(n);\n}"},{"h":"Indefinite loops: digits","p":"A while loop is perfect when you do not know the count ahead of time. Classic AP pattern: peel off digits with <code>% 10<\/code> (last digit) and <code>/ 10<\/code> (drop last digit) until nothing is left.","code":"int num = 4721;\nint sum = 0;\nwhile (num > 0) {\n    sum += num % 10;\n    num /= 10;\n}\nSystem.out.println(sum);"},{"h":"Sentinel loops","p":"A sentinel is a special stop value. The loop keeps going until it sees it. Here, doubling until we pass 100.","code":"int value = 3;\nint steps = 0;\nwhile (value <= 100) {\n    value *= 2;\n    steps++;\n}\nSystem.out.println(value + \" in \" + steps + \" steps\");"}]},{"id":"2.8","unit":2,"title":"for loops","file":"ForLoops.java","cards":[{"h":"All four parts on one line","p":"<code>for (init; condition; update)<\/code>. Order: init runs once, then condition → body → update → condition → body → update... until the condition is false. The update runs <b>after<\/b> the body.","code":"for (int i = 0; i < 4; i++) {\n    System.out.print(i + \" \");\n}\nSystem.out.println();"},{"h":"Counting how many times","p":"<code>i = 0; i &lt; n<\/code> runs n times. <code>i = 1; i &lt;= n<\/code> also runs n times. <code>i = 0; i &lt;= n<\/code> runs n + 1 times. Off-by-one errors are the most common loop bug.","code":"int a = 0;\nfor (int i = 0; i < 5; i++) { a++; }\nint b = 0;\nfor (int i = 1; i <= 5; i++) { b++; }\nint c = 0;\nfor (int i = 0; i <= 5; i++) { c++; }\nSystem.out.println(a + \" \" + b + \" \" + c);"},{"h":"Steps other than 1","p":"The update can be anything: count by 2, count down, multiply.","code":"for (int i = 10; i > 0; i -= 3) {\n    System.out.print(i + \" \");\n}\nSystem.out.println();\nfor (int k = 1; k < 50; k *= 3) {\n    System.out.print(k + \" \");\n}\nSystem.out.println();"},{"h":"for and while are the same machine","p":"Any for loop can be rewritten as a while loop: move the init above, the update to the end of the body. One difference: a variable declared in the for header disappears after the loop.","code":"for (int i = 0; i < 3; i++) {\n    System.out.print(i);\n}\nSystem.out.println();\nint j = 0;\nwhile (j < 3) {\n    System.out.print(j);\n    j++;\n}\nSystem.out.println();"}]},{"id":"2.9","unit":2,"title":"Loop algorithms","file":"LoopAlgorithms.java","cards":[{"h":"Accumulator: running total","p":"Start at 0 (or 1 for a product), add inside the loop. Your notes: \"on the AP exam there's always something with sums.\"","code":"int sum = 0;\nfor (int i = 1; i <= 5; i++) {\n    sum += i;\n}\nSystem.out.println(sum);"},{"h":"Counter: how many match","p":"Start a counter at 0 and add 1 only when an if is true.","code":"int count = 0;\nfor (int n = 1; n <= 20; n++) {\n    if (n % 3 == 0) {\n        count++;\n    }\n}\nSystem.out.println(count);"},{"h":"Min and max","p":"Start with the first value (or an extreme like Integer.MAX_VALUE for a min), then replace it whenever you see something better.","code":"int a = 7, b = 2, c = 9, d = 4;\nint max = a;\nif (b > max) { max = b; }\nif (c > max) { max = c; }\nif (d > max) { max = d; }\nSystem.out.println(max);"},{"h":"Early exit with a flag","p":"To check \"is there any...\" or \"are all...\", use a boolean that starts one way and flips if you find a counterexample. Example: is 29 prime?","code":"int n = 29;\nboolean isPrime = n > 1;\nfor (int d = 2; d < n; d++) {\n    if (n % d == 0) {\n        isPrime = false;\n    }\n}\nSystem.out.println(isPrime);"}]},{"id":"2.10","unit":2,"title":"String algorithms","file":"StringAlgorithms.java","cards":[{"h":"Walk through a String one letter at a time","p":"Loop i from 0 while <code>i &lt; s.length()<\/code>, and grab the letter with <code>s.substring(i, i + 1)<\/code>. Using <code>&lt;=<\/code> crashes on the last pass.","code":"String s = \"cat\";\nfor (int i = 0; i < s.length(); i++) {\n    String letter = s.substring(i, i + 1);\n    System.out.println(i + \": \" + letter);\n}"},{"h":"Count a letter","p":"Traverse plus a counter plus <code>.equals<\/code>.","code":"String word = \"mississippi\";\nint count = 0;\nfor (int i = 0; i < word.length(); i++) {\n    if (word.substring(i, i + 1).equals(\"s\")) {\n        count++;\n    }\n}\nSystem.out.println(count);"},{"h":"Build a new String","p":"Start with <code>\"\"<\/code> and add letters. Putting each new letter in front reverses the word.","code":"String s = \"stop\";\nString rev = \"\";\nfor (int i = 0; i < s.length(); i++) {\n    rev = s.substring(i, i + 1) + rev;\n}\nSystem.out.println(rev);"},{"h":"Find every match with indexOf","p":"Find a match, then chop off everything up to and including it, and search again. Stop when indexOf gives -1.","code":"String s = \"a-b-c-d\";\nint dashes = 0;\nint pos = s.indexOf(\"-\");\nwhile (pos != -1) {\n    dashes++;\n    s = s.substring(pos + 1);\n    pos = s.indexOf(\"-\");\n}\nSystem.out.println(dashes);"}]},{"id":"2.11","unit":2,"title":"Nested loops","file":"NestedLoops.java","cards":[{"h":"The inner loop runs all the way for each outer pass","p":"Outer loop starts pass 1 → inner loop runs completely → outer pass 2 → inner runs completely again. Like a clock: the minute hand goes all the way around for every hour.","code":"for (int row = 1; row <= 3; row++) {\n    for (int col = 1; col <= 4; col++) {\n        System.out.print(\"*\");\n    }\n    System.out.println();\n}"},{"h":"Total runs = outer × inner","p":"If the inner bounds do not depend on the outer variable, the inner body runs (outer count) × (inner count) times.","code":"int count = 0;\nfor (int i = 0; i < 3; i++) {\n    for (int j = 0; j < 5; j++) {\n        count++;\n    }\n}\nSystem.out.println(count);"},{"h":"Triangles: inner depends on outer","p":"When the inner bound uses the outer variable, each row gets a different length.","code":"for (int i = 1; i <= 4; i++) {\n    for (int j = 1; j <= i; j++) {\n        System.out.print(j);\n    }\n    System.out.println();\n}"}]},{"id":"2.12","unit":2,"title":"Counting loop runs","file":"RunTime.java","cards":[{"h":"Informal run-time analysis","p":"The AP exam asks \"how many times does this statement execute?\" Count passes with the formula, then check it by tracing a small case. For <code>i = a; i &lt; b; i++<\/code> the count is b - a. For <code>&lt;=<\/code> it is b - a + 1.","code":"int runs = 0;\nfor (int i = 3; i < 10; i++) {\n    runs++;\n}\nSystem.out.println(runs);"},{"h":"Steps that are not 1","p":"Counting by 2 roughly halves it. Doubling (i *= 2) grows fast, so very few passes. When in doubt, write out the values of i.","code":"int a = 0;\nfor (int i = 0; i < 10; i += 2) { a++; }\nint b = 0;\nfor (int i = 1; i < 100; i *= 2) { b++; }\nSystem.out.println(a + \" \" + b);"},{"h":"Triangle nested loops","p":"When the inner loop depends on the outer, add up each row: 1 + 2 + 3 + ... + n.","code":"int count = 0;\nfor (int i = 1; i <= 4; i++) {\n    for (int j = 1; j <= i; j++) {\n        count++;\n    }\n}\nSystem.out.println(count);"}]}],"questions":[{"t":"trace","topic":"1.3","code":"System.out.println(17 / 5);\nSystem.out.println(17 % 5);","wrong":["3.4\n2","3\n3","3.4\n0.4"],"why":"17 / 5 is int / int, so the decimal is chopped: 3. The remainder is 17 - 15 = 2.","id":"1.3-1rfiq4q","answer":"3\n2"},{"t":"trace","topic":"1.3","code":"System.out.print(\"Hi\");\nSystem.out.print(\"There\");\nSystem.out.println(\"!\");\nSystem.out.println(\"Bye\");","wrong":["Hi\nThere\n!\nBye","HiThere!Bye","Hi There !\nBye"],"why":"print stays on the same line. Only println moves to a new line after printing.","id":"1.3-p88v8u","answer":"HiThere!\nBye"},{"t":"trace","topic":"1.3","code":"System.out.println(1 + 2 + \"3\" + 4 + 5);","wrong":["15","12345","339"],"why":"Left to right: 1 + 2 = 3 (both ints). Then 3 + \"3\" = \"33\" (now a String). After that every + glues: \"334\", \"3345\".","id":"1.3-zpgk9r","answer":"3345"},{"t":"trace","topic":"1.3","code":"int a = 10;\nint b = 4;\ndouble c = a / b;\nSystem.out.println(c);","wrong":["2.5","2","3.0"],"why":"a / b is int / int = 2, computed BEFORE it gets stored. Storing 2 in a double just makes it 2.0.","id":"1.3-6nk0nx","answer":"2.0"},{"t":"trace","topic":"1.3","code":"System.out.println(10 - 4 / 2 * 3 % 4);","wrong":["9","1","6"],"why":"/, *, % go first, left to right: 4 / 2 = 2, 2 * 3 = 6, 6 % 4 = 2. Then 10 - 2 = 8.","id":"1.3-ztpuvz","answer":"8"},{"t":"trace","topic":"1.3","code":"System.out.println(5 % 8);\nSystem.out.println(8 % 8);\nSystem.out.println(-7 % 3);","wrong":["3\n1\n2","5\n0\n2","0\n0\n-2"],"why":"When the left side is smaller, the remainder is the whole left side: 5 % 8 = 5. 8 % 8 = 0. In Java the remainder takes the sign of the left side: -7 % 3 = -1.","id":"1.3-h10y7r","answer":"5\n0\n-1"},{"t":"trace","topic":"1.3","code":"System.out.println(\"Total: \" + 3 + 4);\nSystem.out.println(\"Total: \" + (3 + 4));","wrong":["Total: 7\nTotal: 7","Total: 34\nTotal: 34","Total: 7\nTotal: 34"],"why":"Without parentheses, \"Total: \" + 3 is a String, so + 4 glues another character. Parentheses force the addition first.","id":"1.3-uuk651","answer":"Total: 34\nTotal: 7"},{"t":"mc","topic":"1.3","q":"Which expression evaluates to 2.5?","answer":"5.0 / 2","wrong":["5 / 2","(double) (5 / 2)","5 / 2 * 1.0"],"why":"Only 5.0 / 2 has a double in the division itself. The others do integer division first (giving 2) and then turn 2 into 2.0.","id":"1.3-gd5p3v"},{"t":"trace","topic":"1.4","code":"int x = 4;\nint y = x;\nx = x + 3;\nSystem.out.println(x + \" \" + y);","wrong":["7 7","4 4","7 3"],"why":"y gets a copy of x's value (4) at that moment. Changing x afterwards does not touch y.","id":"1.4-1cgdoz8","answer":"7 4"},{"t":"trace","topic":"1.4","code":"int a = 5;\nint b = 9;\na = b;\nb = a;\nSystem.out.println(a + \" \" + b);","wrong":["9 5","5 9","5 5"],"why":"This swap is broken. After a = b, both are 9, and the original 5 is gone. You need a temp variable.","id":"1.4-11g01tm","answer":"9 9"},{"t":"trace","topic":"1.4","code":"int n = 2;\nn = n * n;\nn = n * n;\nn = n - 1;\nSystem.out.println(n);","wrong":["3","7","8"],"why":"2 → 4 → 16 → 15. Each line uses the value stored by the line before.","id":"1.4-3zemi3","answer":"15"},{"t":"fill","topic":"1.4","task":"Swap the values so it prints \"8 3\".","code":"int a = 3;\nint b = 8;\nint temp = a;\na = b;\n____\nSystem.out.println(a + \" \" + b);","opts":["b = temp;","b = a;","temp = b;","a = temp;"],"expect":"8 3","why":"temp saved a's original 3. a now holds 8, so b needs the saved 3 from temp.","id":"1.4-z1p3mq","optOut":["8 3","8 8","8 8","3 8"]},{"t":"bug","topic":"1.4","task":"Should print 15.","code":"int total;\ntotal = total + 15;\nSystem.out.println(total);","bug":1,"fix":"int total = 0;","expect":"15","why":"A local variable has no value until you give it one. Java refuses to compile total + 15 because total might not have been initialized.","id":"1.4-1wsbhx2","fixed":"int total = 0;\ntotal = total + 15;\nSystem.out.println(total);","bugOut":"Compile error"},{"t":"trace","topic":"1.5","code":"double d = 9.99;\nint n = (int) d;\nSystem.out.println(n);\nSystem.out.println((int) -9.99);","wrong":["10\n-10","9\n-10","10\n-9"],"why":"(int) truncates toward zero, it never rounds. 9.99 → 9 and -9.99 → -9.","id":"1.5-1ss5wzt","answer":"9\n-9"},{"t":"trace","topic":"1.5","code":"System.out.println((double) 9 / 2);\nSystem.out.println((double) (9 / 2));","wrong":["4.5\n4.5","4.0\n4.5","4\n4.0"],"why":"The cast grabs only the 9 in the first line (9.0 / 2 = 4.5). In the second, 9 / 2 = 4 happens first, then becomes 4.0.","id":"1.5-1qxyoc3","answer":"4.5\n4.0"},{"t":"trace","topic":"1.5","code":"int a = 7;\nint b = 2;\ndouble avg = (a + b) / 2;\nSystem.out.println(avg);","wrong":["4.5","4","5.0"],"why":"(a + b) / 2 is 9 / 2, an int division = 4. It is stored as 4.0. To fix it, divide by 2.0.","id":"1.5-1u5dlth","answer":"4.0"},{"t":"trace","topic":"1.5","code":"double x = 6.5;\nint r = (int) (x + 0.5);\nSystem.out.println(r);\ndouble y = 6.49;\nSystem.out.println((int) (y + 0.5));","wrong":["6\n6","7\n7","6\n7"],"why":"6.5 + 0.5 = 7.0 → 7. 6.49 + 0.5 = 6.99 → 6. That is how the +0.5 trick rounds.","i
